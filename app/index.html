<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeQuest</title>
<meta name="description" content="LifeQuest – Alltags-Abenteuer für die ganze Familie.">
<meta name="theme-color" content="#5B3BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LifeQuest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
body{font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,.head{font-family:var(--font-head)}

body[data-tier="kid"]{--font:'Baloo 2',ui-rounded,system-ui,sans-serif;--font-head:'Baloo 2',ui-rounded,sans-serif;--fs:17px;
  --bg:#FFF7E8;--card:#FFFFFF;--card2:#FFF1D6;--text:#1D3557;--muted:#6B7A99;--line:rgba(29,53,87,.08);
  --accent:#FF4F87;--accent-d:#D93169;--grad:linear-gradient(135deg,#FF7AA8,#FF4F87);--on-accent:#fff;--accent2:#FFC530;
  --hero:linear-gradient(170deg,#4FC3FF 0%,#7FD8FF 55%,#BDEEFF 100%);--hero-text:#123056;--chip:rgba(255,255,255,.75);--chip-text:#123056;
  --r:26px;--r-sm:18px;--shadow:0 6px 0 rgba(29,53,87,.07),0 12px 28px rgba(29,53,87,.08);--btn-sh:0 5px 0 var(--accent-d);
  --ring:#FF4F87;--ring-track:rgba(255,255,255,.7);--done:#22C55E;--track:#FFE4A8}
body[data-tier="tween"]{--font:'Nunito',system-ui,sans-serif;--font-head:'Fredoka',system-ui,sans-serif;--fs:16px;
  --bg:#F3F0FF;--card:#FFFFFF;--card2:#F1ECFF;--text:#1C1640;--muted:#6E6896;--line:rgba(108,76,255,.10);
  --accent:#6C4CFF;--accent-d:#4B2FD6;--grad:linear-gradient(135deg,#7C5CFF,#C04CFF);--on-accent:#fff;--accent2:#FFB020;
  --hero:linear-gradient(135deg,#5B3BFF 0%,#A64CFF 55%,#FF6FA3 100%);--hero-text:#fff;--chip:rgba(255,255,255,.18);--chip-text:#fff;
  --r:22px;--r-sm:14px;--shadow:0 10px 30px rgba(76,48,200,.12);--btn-sh:0 4px 0 var(--accent-d);
  --ring:#FFD34D;--ring-track:rgba(255,255,255,.25);--done:#14C9A0;--track:#E6E0FF}
body[data-tier="teen"]{--font:'Inter',system-ui,sans-serif;--font-head:'Space Grotesk',system-ui,sans-serif;--fs:15px;
  --bg:#08080A;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--text:#F4F4F5;--muted:#8B8B95;--line:rgba(255,255,255,.08);
  --accent:#C8FF3D;--accent-d:#A6D82A;--grad:linear-gradient(120deg,#C8FF3D,#5CE1FF);--on-accent:#08080A;--accent2:#5CE1FF;
  --hero:radial-gradient(120% 90% at 0% 0%,rgba(200,255,61,.28),transparent 55%),radial-gradient(90% 80% at 100% 0%,rgba(92,225,255,.25),transparent 55%),#0B0B0E;--hero-text:#fff;--chip:rgba(255,255,255,.06);--chip-text:#fff;
  --r:18px;--r-sm:12px;--shadow:none;--btn-sh:none;--ring:#C8FF3D;--ring-track:rgba(255,255,255,.1);--done:#C8FF3D;--track:rgba(255,255,255,.08)}
body[data-tier="parent"]{--font:'Plus Jakarta Sans',system-ui,sans-serif;--font-head:'Plus Jakarta Sans',system-ui,sans-serif;--fs:15px;
  --bg:#F5F4F0;--card:#FFFFFF;--card2:#F2F1EC;--text:#17212F;--muted:#6A7383;--line:#E8E6E0;
  --accent:#2E6BFF;--accent-d:#1F51CC;--grad:linear-gradient(135deg,#3B7BFF,#2E5BFF);--on-accent:#fff;--accent2:#14B87A;
  --hero:linear-gradient(140deg,#14263F 0%,#1F4A8A 60%,#2E6BFF 100%);--hero-text:#fff;--chip:rgba(255,255,255,.12);--chip-text:#fff;
  --r:20px;--r-sm:12px;--shadow:0 1px 2px rgba(23,33,47,.04),0 8px 24px rgba(23,33,47,.06);--btn-sh:none;
  --ring:#5EE0A8;--ring-track:rgba(255,255,255,.2);--done:#14B87A;--track:#ECEAE4}

.app{max-width:460px;margin:0 auto;padding:0 16px 130px;position:relative;padding-top:env(safe-area-inset-top)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.82em}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px;gap:10px}
.sec h2{margin:0;font-size:1.22em;font-weight:700}
body[data-tier="kid"] .sec h2{font-size:1.32em;font-weight:800}
.sec .more{font-size:.82em;font-weight:800;color:var(--accent);white-space:nowrap}
.note{font-size:.76em;color:var(--muted);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:var(--on-accent);border-radius:999px;padding:13px 20px;font-weight:800;box-shadow:var(--btn-sh);font-family:var(--font-head);transition:transform .08s}
body[data-tier="teen"] .btn{font-weight:600}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--text);box-shadow:none}
.btn.danger{background:#FEE4E2;color:#B42318;box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:.85em}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--card2);font-size:.72em;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.peer{background:color-mix(in srgb,#8B5CF6 14%,transparent);color:#8B5CF6}
.chip.par{background:color-mix(in srgb,#F59E0B 16%,transparent);color:#B87300}
.chip.qr{background:color-mix(in srgb,#16A34A 15%,transparent);color:#15803D}
body[data-tier="teen"] .chip.peer{color:#C4B5FD} body[data-tier="teen"] .chip.par{color:#FBBF24} body[data-tier="teen"] .chip.qr{color:#86EFAC}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--accent);margin:18px 0 4px}

/* Hero */
.hero{position:relative;margin:0 -16px;padding:18px 18px 22px;background:var(--hero);color:var(--hero-text);border-radius:0 0 34px 34px;overflow:hidden}
.hero .deco{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.hero>*:not(.deco){position:relative}
.hello{font-family:var(--font-head);font-size:1.6em;font-weight:800;line-height:1.05}
body[data-tier="teen"] .hello{letter-spacing:-.03em;font-weight:700}
.hsub{font-size:.85em;opacity:.8;margin-top:3px;font-weight:600}
.avring{position:relative;width:66px;height:66px;flex:none}
.avring svg{position:absolute;inset:0}
.avring .av{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.92);font-weight:800;color:#1D3557}
body[data-tier="teen"] .avring .av{background:#18181C;color:var(--accent);font-family:var(--font-head);font-size:22px}
.avring .lv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#1D1D1D;font:800 10px/1 Inter,sans-serif;padding:3px 6px;border-radius:99px;border:2px solid #fff;white-space:nowrap}
.coin{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:8px 12px;font-weight:800;font-family:var(--font-head)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hs{background:var(--chip);color:var(--chip-text);border-radius:var(--r-sm);padding:10px 12px}
body[data-tier="teen"] .hs,body[data-tier="teen"] .coin{border:1px solid var(--line)}
.hs b{display:block;font-family:var(--font-head);font-size:1.3em;font-weight:800;line-height:1.1}
.hs span{font-size:.7em;font-weight:700;opacity:.8}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-text)}
.banner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);margin-top:14px;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--card)}
.banner .bi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:var(--card2)}
.banner.peer{background:linear-gradient(135deg,color-mix(in srgb,#8B5CF6 12%,var(--card)),var(--card));border-color:color-mix(in srgb,#8B5CF6 25%,transparent)}
.banner.gold{background:linear-gradient(135deg,color-mix(in srgb,#FFB020 18%,var(--card)),var(--card));border-color:color-mix(in srgb,#FFB020 35%,transparent)}

/* Quests */
.tod{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-weight:800;font-size:.85em;color:var(--muted);font-family:var(--font-head)}
.tod::after{content:"";flex:1;height:1px;background:var(--line)}
.quest{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.quest+.quest{margin-top:10px}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
body[data-tier="kid"] .tile{width:56px;height:56px;font-size:30px;border-radius:20px}
body[data-tier="teen"] .tile{background:color-mix(in srgb,var(--c1) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 45%,transparent);font-size:20px;width:44px;height:44px;border-radius:12px}
body[data-tier="parent"] .tile{width:44px;height:44px;font-size:21px;border-radius:14px;box-shadow:none}
.qt{font-weight:800;line-height:1.2;font-family:var(--font-head)}
body[data-tier="teen"] .qt,body[data-tier="parent"] .qt{font-weight:600}
.qs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.76em;color:var(--muted);margin-top:4px}
.xp{font:800 .72em/1 var(--font-head);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 7px;border-radius:99px;flex:none}
.qbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;border:3px solid var(--track);color:transparent;font-weight:900;font-size:18px}
body[data-tier="kid"] .qbtn{width:48px;height:48px;font-size:22px}
body[data-tier="teen"] .qbtn{border-width:2px;border-radius:12px;width:38px;height:38px}
.qbtn.scan{border:none;background:#16A34A;color:#fff;flex-direction:column;line-height:1}
.qbtn.scan svg{width:18px;height:18px}
.qbtn.scan span{font:800 9px/1 Inter,sans-serif;margin-top:1px}
.quest.done{opacity:.6}
.quest.done .qt{text-decoration:line-through;text-decoration-thickness:2px}
.quest.done .qbtn{background:var(--done);border-color:var(--done);color:#fff}
body[data-tier="teen"] .quest.done .qbtn{color:#08080A}
.quest.pending .qbtn{border-style:dashed;border-color:#8B5CF6;color:#8B5CF6;font-size:16px}
.who{display:flex;gap:4px;margin-top:8px}
.who span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--card2);font-weight:800;opacity:.45;border:2px solid transparent}
.who span.ok{opacity:1;border-color:var(--done)}
.who span.pend{opacity:1;border-color:#8B5CF6;border-style:dashed}

/* Streak */
.streak .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.streak .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7em;font-weight:800;color:var(--muted)}
.streak .d i{width:100%;aspect-ratio:1;max-width:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-style:normal;font-size:16px}
body[data-tier="teen"] .streak .d i{border-radius:10px}
.streak .d.on i{background:linear-gradient(140deg,#FFB020,#FF5A36);box-shadow:0 3px 0 #D9461F}
body[data-tier="teen"] .streak .d.on i{background:var(--accent);box-shadow:none;color:#08080A}
.streak .d.today i{outline:3px solid var(--accent);outline-offset:2px}
.bigflame{font-size:40px;line-height:1}

/* Familie */
.fam{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.fam::-webkit-scrollbar{display:none}
.fam .p{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:62px;font-size:.72em;font-weight:700;text-align:center}
.rg{position:relative;width:54px;height:54px;flex:none}
.rg svg{position:absolute;inset:0}
.rg .av{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card2);font-weight:800}
body[data-tier="teen"] .rg .av{background:#18181C;font-size:15px;color:var(--accent)}
.pact{border-radius:var(--r);padding:20px;background:linear-gradient(160deg,#FFF6DA,#FFE7B0);color:#3A2A00;box-shadow:var(--shadow);border:2px solid #F2C45A;position:relative}
.pact h3{margin:0 0 6px;font-size:1.3em}
.pact ul{margin:10px 0;padding-left:20px;line-height:1.6}
.pact .sig{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pact .sig span{background:rgba(255,255,255,.7);padding:5px 10px;border-radius:99px;font-weight:800;font-size:.8em}
.pact .sig span.no{opacity:.45}

/* Missionen */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:16px}
.search input{border:none;outline:none;background:none;flex:1;min-width:0}
.bubbles{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.bubbles::-webkit-scrollbar{display:none}
.bub{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:66px;font-size:.7em;font-weight:800;text-align:center;line-height:1.1}
.bub .o{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000)}
body[data-tier="teen"] .bub .o{background:color-mix(in srgb,var(--c) 12%,#111);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.bub.on .o{outline:3px solid var(--accent);outline-offset:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mtile{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:var(--r);padding:14px;min-height:164px;color:#fff;overflow:hidden;background:linear-gradient(155deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 75%,#000),0 12px 22px rgba(0,0,0,.08)}
body[data-tier="tween"] .mtile,body[data-tier="parent"] .mtile{box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent)}
body[data-tier="teen"] .mtile{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 35%,transparent),transparent 60%),#141418;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.carousel .mtile{flex:none;width:196px}
.mtile .me{font-size:44px;line-height:1;margin-bottom:auto}
.mtile .mt{font-family:var(--font-head);font-weight:800;font-size:1.02em;line-height:1.15;margin-top:12px}
.mtile .mm{font-size:.72em;font-weight:700;opacity:.88;margin-top:4px}
.mtile .rib{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:#111;border-radius:99px;padding:3px 8px;font:800 10px/1.2 Inter,sans-serif}
body[data-tier="teen"] .mtile .rib{background:var(--accent);color:#08080A}
.mtile.locked{filter:grayscale(.85);opacity:.6}
.mtile.add{background:var(--card);color:var(--muted);border:2px dashed var(--line);box-shadow:none;align-items:center;justify-content:center;text-align:center;font-weight:800}
.mprog{height:7px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:10px}
.mprog i{display:block;height:100%;background:#fff;border-radius:9px}
body[data-tier="teen"] .mprog i{background:var(--accent)}

/* Listen */
.li{display:flex;align-items:center;gap:12px;padding:12px 0}
.li+.li{border-top:1px solid var(--line)}
.li .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card2);flex:none;font-weight:800}
.menu{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;font-weight:700}
.menu+.menu{border-top:1px solid var(--line)}
.menu .mi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card2)}
.x{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none;font-size:14px}

/* Shop */
.wallet{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,#FFB020,#FF7A1A);color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-top:16px}
body[data-tier="teen"] .wallet{background:#141418;border:1px solid var(--line);color:var(--text)}
.wallet .big{font-family:var(--font-head);font-size:2.2em;font-weight:800;line-height:1}
.rw{display:flex;flex-direction:column;align-items:flex-start;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);min-height:170px}
.rw .re{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--card2);margin-bottom:10px}
.rw .rt{font-family:var(--font-head);font-weight:800;line-height:1.15;flex:1}
.rw .price{margin-top:10px;width:100%}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:.72em;font-weight:700;line-height:1.15}
.medal .md{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,#FFD866,#FFA51F);box-shadow:0 4px 0 #D98A0A,inset 0 0 0 4px rgba(255,255,255,.4)}
body[data-tier="teen"] .medal .md{background:#18181C;box-shadow:inset 0 0 0 1px var(--accent);font-size:22px}
.tagwrap{display:flex;flex-wrap:wrap;gap:8px}
.tg{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85em;box-shadow:var(--shadow)}
.tg.on{background:var(--grad);color:var(--on-accent);border-color:transparent}
.tg.add{border-style:dashed;box-shadow:none;color:var(--muted)}

/* Nav */
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:436px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px;background:var(--card);border-radius:28px;border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.14)}
body[data-tier="teen"] .nav{background:rgba(20,20,24,.9);backdrop-filter:blur(16px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 0;position:relative}
.nav button .ic{font-size:24px;line-height:1;height:24px;display:grid;place-items:center}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;top:-2px;left:calc(50% + 6px);background:#FF3B30;color:#fff;border-radius:99px;font:800 9.5px/1 Inter;padding:3px 5px}
.nav .scanbtn{margin-top:-30px}

.stepbar i{flex:1;height:6px;border-radius:9px;background:var(--track)}

.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avgrid button{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:24px;font-weight:800}
.avgrid button.on{border-color:var(--accent);transform:scale(1.08)}
.gsug{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow)}
.gsug+.gsug{margin-top:8px}
.gsug.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.gsug .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-weight:900}
.gsug.on .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.local{background:#FFF4CC;color:#5B4500;font:600 12px/1.3 Inter,sans-serif;padding:8px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap}
.local button{background:#fff;border-radius:99px;padding:4px 10px;font-weight:700;flex:none}
.local button.on{background:#5B4500;color:#fff}
.err{background:#FEE4E2;color:#912018;font:600 12.5px/1.3 Inter;padding:8px 12px;text-align:center}

/* Druck */
.printgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{background:#fff;color:#111;border:2px dashed #bbb;border-radius:14px;padding:12px;text-align:center;break-inside:avoid}
.pcard svg{width:100%;max-width:170px;height:auto}
.pcard b{display:block;margin-top:6px;font-size:13px}
.pcard small{display:block;color:#666;font:600 11px/1.3 Inter;margin-top:3px;letter-spacing:.06em}
@media print{
  body{background:#fff!important}
  .nav,.noprint,.local,.err{display:none!important}
  .app{max-width:none;padding:0}
  .printgrid{grid-template-columns:repeat(3,1fr)}
}

function mTile(p, mi, locked){
  const ms = (p.missions||[]).find(a => a.id === mi.id);
  const rib = locked ? '🔒 ' + mi.needs.filter(n => !p.equip.includes(n)).map(n => equipAll()[n]?.e||'?').join('') : mi.custom ? '🏠 eigene' : mi.steps.some(s => stepCheck(s)==='qr') ? '📷 QR' : '';
  return `<button class="mtile ${locked?'locked':''}" style="--c:${CATS[mi.cat].c}" data-a="mission" data-id="${mi.id}">${rib?`<span class="rib">${rib}</span>`:''}<span class="me">${esc(mi.e||CATS[mi.cat].e)}</span><span class="mt">${esc(mi.title)}</span><span class="mm">${mi.weeks} ${+mi.weeks===1?'Woche':'Wochen'} · ${mi.steps.length} Schritte</span>${ms?`<span class="mprog"><i style="width:${ms.step/mi.steps.length*100}%"></i></span>`:''}</button>`;
}
function viewMissionen(p, manage){
  const tier = tierOf(p), all = missionsAll();
  const ageOk = manage || p.role === 'parent' ? all : all.filter(x => p.age >= x.age[0] && p.age <= x.age[1]);
  const hasEq = x => (x.needs||[]).every(n => (p.equip||[]).includes(n));
  const q = UI.search.trim().toLowerCase();
  const pool = ageOk.filter(x => (!q || (x.title+' '+x.desc+' '+CATS[x.cat].n).toLowerCase().includes(q)) && (!UI.cat || x.cat === UI.cat));
  const active = (p.missions||[]).map(a => mById(a.id)).filter(Boolean);
  const rest = pool.filter(x => !active.includes(x));
  const rec = rest.filter(x => manage || hasEq(x)).sort((a,b) => ((b.custom?2:0)+((p.interests||[]).includes(b.cat)?1:0)) - ((a.custom?2:0)+((p.interests||[]).includes(a.cat)?1:0)));
  const locked = manage ? [] : rest.filter(x => !hasEq(x));
  const addTile = `<button class="mtile add" data-a="newMission"><span style="font-size:34px">＋</span>${p.role==='parent'?'Eigene Mission anlegen':'Mission vorschlagen'}</button>`;

    <div class="bubbles">${Object.entries(CATS).map(([k,c]) => `<button class="bub ${UI.cat===k?'on':''}" style="--c:${c.c}" data-a="cat" data-id="${UI.cat===k?'':k}"><span class="o">${c.e}</span>${c.n}</button>`).join('')}</div>
    ${active.length && !manage ? `<div class="sec"><h2>Aktiv</h2><span class="more">${active.length}</span></div><div class="carousel">${active.map(x => mTile(p,x,false)).join('')}</div>` : ''}

    <div class="grid2">${addTile}${rec.map(x => mTile(p,x,false)).join('')}</div>

// ---------- Scanner ----------
let camStream = null, camRAF = null;
function openScan(target){ UI.scan = {target, msg:null}; render(); startCam(); }
function renderScanner(){
  if (!UI.scan) return '';
  const t = UI.scan.target, lab = t && t !== 'join' ? labelOfKey(t) : null;
  return `<div class="scanner"><video id="cam" playsinline muted></video>
    <div class="top"><button data-a="scanClose">✕</button><b>QR-Code scannen</b><span style="width:40px"></span></div>
    <div class="finder"><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i><div class="laser"></div></div>
    <div class="sh">${UI.scan.msg ? esc(UI.scan.msg) : lab ? `Für: ${esc(lab.title)}` : 'Halte die Kamera auf einen LifeQuest-Code.'}</div>
    <div class="manual"><div class="small" style="opacity:.7;margin-bottom:8px">Kamera klappt nicht? Code unter dem QR eingeben:</div>
      <div class="row"><input id="manualCode" placeholder="z. B. G-AB12CD" autocapitalize="characters"><button class="btn sm" data-a="manualScan">OK</button></div>
      ${t && t.startsWith('m:') ? `<button class="btn soft block sm" style="margin-top:10px;background:#2a2a32;color:#fff" data-a="parentInstead" data-id="${esc(t)}">Stattdessen Eltern-Check anfragen</button>` : ''}</div></div>`;
}
async function startCam(){
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = $('#cam'); if (!v){ stopCam(); return; } v.srcObject = camStream; await v.play();
    const c = document.createElement('canvas'), ctx = c.getContext('2d', {willReadFrequently:true});
    const loop = () => {
      if (!UI.scan || !camStream) return;
      const vv = $('#cam');
      if (vv && vv.readyState >= 2){ const w = 480, h = Math.round(vv.videoHeight/vv.videoWidth*w) || 360; c.width = w; c.height = h; ctx.drawImage(vv, 0, 0, w, h);
        const res = jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'dontInvert'}); if (res && res.data){ onScanned(res.data); return; } }
      camRAF = requestAnimationFrame(loop);
    };
    loop();
  } catch(e){ UI.scan && (UI.scan.msg = 'Kein Kamerazugriff – Code unten eingeben.'); softRender(); }
}
function stopCam(){ if (camRAF) cancelAnimationFrame(camRAF); camRAF = null; if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function onScanned(text){
  if (navigator.vibrate) navigator.vibrate(60);
  if (!S){ // Beitritt
    const m = String(text).split('|'); const code = m[0] === 'LQ1' && m[2] === 'J' ? m[3] : text;
    stopCam(); UI.scan = null; render(); const inp = $('#joinCode'); if (inp) inp.value = code; doJoin(code); return;
  }
  const r = handleScan(text);
  if (r.join){ UI.scan.msg = 'Das ist ein Kopplungs-Code – dieses Gerät ist schon gekoppelt.'; render(); startCam(); return; }
  if (r.err){ UI.scan.msg = r.err; render(); setTimeout(startCam, 900); return; }
  stopCam(); UI.scan = null; render(); celebrate(r.fin); toast('✓ ' + r.ok);
}
async function doJoin(code){
  if (!code || code.replace(/[^A-Z0-9]/gi,'').length < 8){ toast('Bitte den 8-stelligen Code eingeben'); return; }
  try { await DB.join(code); toast('Gerät gekoppelt 🎉'); } catch(e){ syncErr(e); toast(e.message || 'Koppeln fehlgeschlagen'); }
}

// ---------- Haupt-Render ----------
function render(){
  pendingRender = false;
  const y = window.scrollY;
  let html = '';
  const p = me();
  if (UI.onb){ html = renderOnb(); }
  else if (!S || !p){ html = (S && !p && !LOCAL) ? `<div class="app onb"><div class="hint">Profil nicht gefunden. Bitte das Gerät neu koppeln.</div><button class="btn block" data-a="leave" style="margin-top:12px">Trennen</button></div>` : renderWelcome(); }
  else {
    const tier = tierOf(p); document.body.dataset.tier = tier;
    let body;
    const pg = UI.page;
    if (pg === 'profile') body = viewProfil(p);
    else if (pg === 'library') body = viewMissionen(p, true);
    else if (pg === 'rewards') body = pageRewards();
    else if (pg === 'equipment') body = pageEquipment();
    else if (pg === 'qr') body = pageQR();
    else if (pg === 'devices') body = pageDevices();
    else if (pg === 'settings') body = pageSettings();
    else if (p.role === 'parent') body = [viewHeute, viewFamilie, null, viewChecks, viewMehr][UI.tab](p);
    else body = [viewHeute, viewMissionen, null, viewFamilie, viewShop][UI.tab](p);
    const C = COPY[tier];
    const icons = tier === 'kid' ? ['🏠','🗺️','','👪','🎁'] : p.role === 'parent' ? [ic('home'), ic('users'), '', ic('check'), ic('menu')] : [ic('home'), ic('compass'), '', ic('users'), ic('gift')];
    const nreq = checkRequests(p).length;
    html = (LOCAL ? `<div class="local">🧪 Testmodus · Profil: ${profiles().map(o => `<button class="${o.id===p.id?'on':''}" data-a="switch" data-id="${o.id}">${esc(o.avatar)} ${esc(o.name)}</button>`).join('')}</div>` : '')
      + (UI.err ? `<div class="err">Sync-Problem: ${esc(UI.err)}</div>` : '')
      + `<div class="app">${body}</div>` + navBar(C.tabs, icons, p.role === 'parent' ? {3:nreq} : {3:nreq});
  }
  $('#root').innerHTML = html + (S && me() ? renderModal() : (UI.modal && UI.onb ? renderModal() : '')) + renderScanner();
  window.scrollTo(0, UI.top ? 0 : y); UI.top = false;
}

// ---------- Events ----------
const go = (tab, page=null) => { UI.tab = tab; UI.page = page; UI.top = true; render(); };
document.addEventListener('click', async e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  if (a.dataset.a === 'scrim' && e.target.closest('[data-stop]')) return;
  const id = a.dataset.id, p = me(), F = UI.form, t = today();
  switch (a.dataset.a){
    case 'tab': go(+id); break;
    case 'page': UI.page = id; UI.top = true; render(); break;
    case 'back': UI.page = null; UI.top = true; render(); break;
    case 'profile': UI.page = 'profile'; UI.top = true; UI.modal = null; render(); break;
    case 'switch': DEV.pid = id; saveDev(); UI.page = null; UI.tab = 0; UI.top = true; render(); break;
    case 'scrim': case 'close': closeModal(); break;
    case 'tap': { const it = todayItems(p).find(i => i.key === id); if (it) tap(it); break; }
    case 'tapGoal': { const g = S.goals[id]; tap({key:`g:${g.id}:${g.mode==='together'?'all':p.id}`, check:g.check}); break; }
    case 'scan': openScan(null); break;
    case 'scanJoin': openScan('join'); break;
    case 'scanClose': stopCam(); UI.scan = null; render(); break;
    case 'manualScan': { const v = $('#manualCode').value; if (v) onScanned(v); break; }
    case 'parentInstead': requestParentInstead(id); break;
    case 'join': doJoin($('#joinCode').value); break;
    // Onboarding
    case 'startOnb': UI.onb = {step:0, famName:'', me:{name:'', avatar:'👩'}, members:[], goals:GOAL_SUG.map((g,i) => ({...clone(g), on:i<3})), rewards:REWARD_SUG.map((r,i) => ({...r, on:i<5}))}; UI.top = true; render(); break;
    case 'onbCancel': UI.onb = null; render(); break;
    case 'onbNext': UI.onb.step++; UI.top = true; render(); break;
    case 'onbBack': UI.onb.step--; UI.top = true; render(); break;
    case 'onbMeAv': UI.onb.me.avatar = id; render(); break;
    case 'onbAddMember': resetForm({role:'kid', age:'9', avatar:KID_AV[UI.onb.members.length % KID_AV.length]}); openModal({type:'member', onb:true}); break;
    case 'onbDelMember': UI.onb.members.splice(+id, 1); render(); break;
    case 'onbGoal': UI.onb.goals[+id].on = !UI.onb.goals[+id].on; render(); break;
    case 'onbEditGoal': resetForm({...UI.onb.goals[+id]}); openModal({type:'onbGoal', idx:+id}); break;
    case 'onbNewGoal': resetForm({e:'👪', mode:'together', time:'18:00'}); openModal({type:'onbGoal', idx:-1}); break;
    case 'onbRw': UI.onb.rewards[+id].on = !UI.onb.rewards[+id].on; render(); break;
    case 'onbFinish': finishOnb(); break;
    // Formulare
    case 'fset': UI.form[a.dataset.k] = id; render(); break;
    case 'fday': { const d = +id; F.days = F.days.includes(d) ? F.days.filter(x => x !== d) : [...F.days, d]; render(); break; }
    case 'fneed': F.needs = F.needs.includes(id) ? F.needs.filter(x => x !== id) : [...F.needs, id]; render(); break;
    case 'stepAdd': F.steps.push({t:'', check:'self'}); render(); break;
    case 'stepDel': F.steps.splice(+id, 1); if (!F.steps.length) F.steps.push({t:'',check:'self'}); render(); break;
    case 'stepUp': { const i = +id; if (i > 0) [F.steps[i-1], F.steps[i]] = [F.steps[i], F.steps[i-1]]; render(); break; }
    case 'stepCheck': { const [i, c] = id.split('|'); F.steps[+i].check = c; render(); break; }
    // Ziele & Agenda
    case 'addOwn': resetForm({check:'self', time:'17:00', freq:'all'}); openModal({type:'own'}); break;
    case 'agenda': resetForm({type:'haushalt', time:'18:00', days:[1,2,3,4,5]}); openModal({type:'agenda', id}); break;
    case 'delAgenda': DB.mutate(st => { delete st.agenda[id]; }); toast('Entfernt'); break;
    case 'newGoal': resetForm({e:'👪', mode:'together', time:'18:00'}); openModal({type:'goal'}); break;
    case 'editGoal': resetForm({...S.goals[id]}); openModal({type:'goal', id}); break;
    case 'delGoal': if (confirm('Familienziel entfernen?')){ DB.mutate(st => { delete st.goals[id]; }); closeModal(); } break;
    case 'pact': openModal({type:'pact'}); break;
    case 'signPact': DB.mutate(st => { st.profiles[p.id].pact = Date.now(); }); UI.modal = null; render(); celebrate(true); toast('Pakt unterschrieben ✍️'); break;
    // Missionen
    case 'cat': UI.cat = id || null; render(); break;
    case 'mission': openModal({type:'mission', id}); break;
    case 'startMission': UI.modal = null; DB.mutate(st => { const pp = st.profiles[p.id]; pp.missions = pp.missions||[]; if (!pp.missions.find(x => x.id === id)) pp.missions.push({id, step:0, started:t}); }); celebrate(); toast('Mission gestartet – Schritt 1 steht in „Heute“'); break;
    case 'stopMission': DB.mutate(st => { const pp = st.profiles[p.id]; pp.missions = (pp.missions||[]).filter(x => x.id !== id); }); closeModal(); break;
    case 'newMission': resetForm({e:'', cat:UI.cat||'natur', ageMin:'6', ageMax:'17', weeks:'2', needs:[], steps:[{t:'',check:'self'},{t:'',check:'self'}]}); openModal({type:'missionEdit'}); break;
    case 'editMission': { const mi = S.customMissions[id]; resetForm({e:mi.e, title:mi.title, desc:mi.desc, cat:mi.cat, ageMin:String(mi.age[0]), ageMax:String(mi.age[1]), weeks:String(mi.weeks), needs:[...(mi.needs||[])], steps:mi.steps.map(s => ({t:stepT(s), check:stepCheck(s)}))}); openModal({type:'missionEdit', id}); break; }
    case 'copyMission': { const mi = mById(id); resetForm({e:mi.e||CATS[mi.cat].e, title:mi.title+' (unsere Version)', desc:mi.desc, cat:mi.cat, ageMin:String(mi.age[0]), ageMax:String(mi.age[1]), weeks:String(mi.weeks), needs:[...(mi.needs||[])], steps:mi.steps.map(s => ({t:stepT(s), check:stepCheck(s)}))}); openModal({type:'missionEdit'}); break; }
    case 'delMission': if (confirm('Mission löschen?')){ DB.mutate(st => { delete st.customMissions[id]; Object.values(st.profiles).forEach(pp => pp.missions = (pp.missions||[]).filter(x => x.id !== id)); }); closeModal(); } break;
    case 'hideMission': DB.mutate(st => { st.hiddenMissions = [...new Set([...(st.hiddenMissions||[]), id])]; }); closeModal(); toast('Ausgeblendet'); break;
    case 'unhide': DB.mutate(st => { st.hiddenMissions = (st.hiddenMissions||[]).filter(x => x !== id); }); break;
    // Checks
    case 'okLog': { const [date, key] = id.split('|'); let fin = false; DB.mutate(st => { if (st.log[date]?.[key]?.s !== 'pending') return; const by = st.log[date][key].by; fin = complete(st, date, key, by); st.log[date][key].ok = p.id; if (p.role === 'kid') st.profiles[p.id].xp = (st.profiles[p.id].xp||0) + 5; }); toast('Bestätigt ✓'); break; }
    case 'noLog': { const [date, key] = id.split('|'); DB.mutate(st => { if (st.log[date]) delete st.log[date][key]; }); toast('Zurückgegeben'); break; }
    case 'okRw': DB.mutate(st => { if (st.redemptions[id]) st.redemptions[id].status = 'approved'; }); toast('Freigegeben 🎉'); break;
    case 'noRw': DB.mutate(st => { const r = st.redemptions[id]; if (!r || r.status !== 'pending') return; const rw = st.rewards[r.rid]; st.profiles[r.pid].coins += rw ? rw.cost : 0; delete st.redemptions[id]; }); toast('Coins zurückgegeben'); break;
    case 'okGoalProp': DB.mutate(st => { if (st.goals[id]){ st.goals[id].status = 'active'; st.goals[id].since = t; } }); toast('Familienziel aufgenommen'); break;
    case 'noGoalProp': DB.mutate(st => { delete st.goals[id]; }); break;
    case 'okMissionProp': DB.mutate(st => { if (st.customMissions[id]) st.customMissions[id].status = 'active'; }); closeModal(); toast('Mission freigegeben'); break;
    case 'noMissionProp': DB.mutate(st => { delete st.customMissions[id]; }); break;
    case 'showQR': { const [kind, ref] = id.split('|'); const [mid, stp] = ref.split('.'); const mi = mById(mid); openModal({type:'showQR', title:stepT(mi.steps[+stp]), sub:mi.title, payload:qrPayload(kind, ref), code:shortCode(kind, ref)}); break; }
    // Shop
    case 'redeem': { const r = S.rewards[id]; if (!r || (p.coins||0) < r.cost) break; const rid = uid6(); DB.mutate(st => { const pp = st.profiles[p.id]; if ((pp.coins||0) < r.cost) return; pp.coins -= r.cost; st.redemptions[rid] = {id:rid, pid:p.id, rid:id, status:'pending', at:Date.now()}; }); toast('Wunsch an die Eltern geschickt 💌'); break; }
    case 'newReward': resetForm({e:'🎁', kind:'Erlebnis', cost:'100'}); openModal({type:'reward'}); break;
    case 'editReward': resetForm({...S.rewards[id], cost:String(S.rewards[id].cost)}); openModal({type:'reward', id}); break;
    case 'delReward': DB.mutate(st => { delete st.rewards[id]; }); closeModal(); break;
    // Profil & Ausstattung
    case 'equip': DB.mutate(st => { const pp = st.profiles[p.id]; pp.equip = (pp.equip||[]).includes(id) ? pp.equip.filter(x => x !== id) : [...(pp.equip||[]), id]; }); break;
    case 'interest': DB.mutate(st => { const pp = st.profiles[p.id]; pp.interests = (pp.interests||[]).includes(id) ? pp.interests.filter(x => x !== id) : [...(pp.interests||[]), id]; }); break;
    case 'setAvatar': DB.mutate(st => { st.profiles[p.id].avatar = id; }); break;
    case 'newEquip': UI.prevModal = UI.modal; UI.prevForm = clone(UI.form); resetForm({e:'🔭'}); openModal({type:'equip'}); break;
    case 'delEquip': DB.mutate(st => { delete st.equipment[id]; }); break;
    // Familie & Geräte
    case 'addMember': resetForm({role:'kid', age:'9', avatar:'🐸'}); openModal({type:'member'}); break;
    case 'editMember': { const k = S.profiles[id]; resetForm({name:k.name, role:k.role, age:String(k.age||9), avatar:k.avatar}); openModal({type:'member', id}); break; }
    case 'delMember': if (confirm('Profil wirklich löschen? Punkte und Verlauf gehen verloren.')){ DB.mutate(st => { delete st.profiles[id]; Object.values(st.agenda).forEach(a => { if (a.owner === id) delete st.agenda[a.id]; }); }); closeModal(); } break;
    case 'invite': { openModal({type:'invite', id}); try { const code = await DB.createInvite(id); if (UI.modal?.type === 'invite'){ UI.modal.code = code; render(); } } catch(err){ syncErr(err); toast('Code konnte nicht erstellt werden'); } break; }
    case 'rmDevice': if (confirm('Gerät entfernen?')) DB.removeDevice(id).catch(syncErr); break;
    case 'setting': DB.mutate(st => { st.settings[id] = !st.settings[id]; }); break;
    case 'saveFamName': { const v = $('#famNameIn').value.trim(); if (v) DB.mutate(st => { st.famName = v; }); toast('Gespeichert'); break; }
    case 'qrFilter': UI.form.qrAll = !!id; render(); break;
    case 'print': window.print(); break;
    case 'leave': if (confirm(LOCAL ? 'Alle Testdaten auf diesem Gerät löschen?' : 'Dieses Gerät von der Familie trennen? (Daten der Familie bleiben erhalten)')){
      if (LOCAL){ localStorage.removeItem('lq-local'); S = null; DEV = {}; saveDev(); UI.page = null; render(); }
      else { try { await famRef.update({['members.'+uid]:firebase.firestore.FieldValue.delete()}); } catch(err){} leave('Gerät getrennt'); } } break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.value;
  if (k === 'search'){ UI.search = v; const pos = e.target.selectionStart; render(); const inp = document.querySelector('[data-in="search"]'); if (inp){ inp.focus(); inp.setSelectionRange(pos,pos); } }
  else if (k === 'famName') UI.onb.famName = v;
  else if (k === 'meName'){ UI.onb.me.name = v; const b = document.querySelector('[data-a="onbNext"]'); if (b) b.disabled = !v.trim(); }
  else if (k.startsWith('f.')) UI.form[k.slice(2)] = v;
  else if (k.startsWith('step.')) UI.form.steps[+k.slice(5)].t = v;
});
document.addEventListener('change', e => { const k = e.target.dataset.in; if (k && k.startsWith('f.') && e.target.tagName === 'SELECT'){ UI.form[k.slice(2)] = e.target.value; if (k === 'f.age') render(); } });
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const p = me(), F = UI.form, title = (F.title||'').trim(), t = today();
  const need = () => { if (!title){ toast('Bitte einen Titel eingeben'); return false; } return true; };
  if (f === 'own'){ if (!need()) return; const id = uid6(); const days = F.freq === 'all' ? [...ALL] : F.freq === 'custom' ? [...F.days] : [wd()];
    if (!days.length){ toast('Bitte Tage wählen'); return; }
    DB.mutate(st => { st.agenda[id] = {id, owner:p.id, title, type:F.type, days, time:F.time||'17:00', check:F.check, by:p.id, once:F.freq==='today'?t:null}; }); UI.modal = null; render(); toast('Ziel hinzugefügt'); }
  else if (f === 'agenda'){ if (!need()) return; if (!F.days.length){ toast('Bitte Tage wählen'); return; } const id = uid6(), owner = UI.modal.id;
    DB.mutate(st => { st.agenda[id] = {id, owner, title, type:F.type, days:[...F.days], time:F.time||'18:00', check:F.check, by:p.id}; }); resetForm({type:F.type, time:F.time, days:F.days, check:F.check}); render(); toast('Hinzugefügt'); }
  else if (f === 'goal'){ if (!need()) return; if (!F.days.length){ toast('Bitte Tage wählen'); return; } const id = UI.modal.id || uid6(), par = isParent();
    DB.mutate(st => { const old = st.goals[id] || {}; st.goals[id] = {...old, id, title, e:F.e||'👪', days:[...F.days], time:F.time||'18:00', mode:F.mode, check:F.check, status:old.status || (par?'active':'proposed'), by:old.by||p.id, since:old.since||t}; });
    UI.modal = null; render(); toast(par ? 'Gespeichert' : 'Vorschlag an die Eltern geschickt'); }
  else if (f === 'onbGoal'){ if (!need()) return; const g = {title, e:F.e||'👪', days:[...F.days], time:F.time||'18:00', mode:F.mode, check:F.check, on:true};
    if (UI.modal.idx >= 0) UI.onb.goals[UI.modal.idx] = g; else UI.onb.goals.push(g); UI.modal = null; render(); }
  else if (f === 'member'){ const name = (F.name||'').trim(); if (!name){ toast('Bitte Namen eingeben'); return; }
    const m = {name, role:F.role, age:F.role==='kid'?+F.age:40, avatar:F.avatar||(F.role==='parent'?'🧑':'🐸')};
    if (UI.modal.onb){ UI.onb.members.push(m); UI.modal = null; render(); return; }
    const id = UI.modal.id || 'P'+uid6();
    DB.mutate(st => { const old = st.profiles[id] || {id, xp:0, coins:0, equip:[], interests:[], missions:[], badges:[], pact:null}; st.profiles[id] = {...old, ...m}; }); UI.modal = null; render(); toast('Gespeichert'); }
  else if (f === 'reward'){ if (!need()) return; const id = UI.modal.id || uid6(); DB.mutate(st => { st.rewards[id] = {id, title, e:F.e||'🎁', cost:Math.max(10, +F.cost||100), kind:F.kind}; }); UI.modal = null; render(); toast('Gespeichert'); }
  else if (f === 'equip'){ if (!need()) return; const key = 'x'+uid6().toLowerCase();
    DB.mutate(st => { st.equipment = st.equipment||{}; st.equipment[key] = {n:title, e:F.e||'🧰'}; const pp = st.profiles[p.id]; if (pp.role === 'parent' || true) pp.equip = [...new Set([...(pp.equip||[]), key])]; });
    if (UI.prevModal){ UI.modal = UI.prevModal; UI.form = UI.prevForm; if (UI.modal.type === 'missionEdit') UI.form.needs = [...new Set([...UI.form.needs, key])]; UI.prevModal = null; } else UI.modal = null;
    render(); toast('Ausstattung hinzugefügt'); }
  else if (f === 'mission'){ if (!need()) return;
    const steps = F.steps.map(s => ({t:s.t.trim(), check:s.check})).filter(s => s.t);
    if (!steps.length){ toast('Mindestens einen Schritt eintragen'); return; }
    let a0 = +F.ageMin, a1 = +F.ageMax; if (a0 > a1) [a0, a1] = [a1, a0];
    const id = UI.modal.id || 'c'+uid6().toLowerCase(), par = isParent();
    DB.mutate(st => { const old = st.customMissions[id] || {}; st.customMissions[id] = {id, custom:true, title, e:F.e||CATS[F.cat].e, desc:(F.desc||'').trim(), cat:F.cat, age:[a0, a1], weeks:+F.weeks, needs:[...F.needs], steps, status:old.status === 'active' || par ? 'active' : 'proposed', by:old.by||p.id}; });
    UI.modal = null; render(); toast(par ? 'Mission gespeichert 🚀' : 'Vorschlag an die Eltern geschickt'); }
});

DB.init();
</script>
