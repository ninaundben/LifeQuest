<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeQuest – Demonstrator</title>
<meta name="description" content="Klickbarer Demonstrator: Alltags-Gamification für Familien – Agenda, Missionen, Partner-QR-Check-ins, Peer-Checks, Streaks, Belohnungen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* =================== Themes =================== */
body{font-family:var(--font);font-size:var(--fs);color:var(--text);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background-color .4s}
h1,h2,h3,.head{font-family:var(--font-head)}

body[data-tier="kid"]{
  --font:'Baloo 2',ui-rounded,system-ui,sans-serif;--font-head:'Baloo 2',ui-rounded,sans-serif;--fs:17px;
  --bg:#FFF7E8;--card:#FFFFFF;--card2:#FFF1D6;--text:#1D3557;--muted:#6B7A99;--line:rgba(29,53,87,.08);
  --accent:#FF4F87;--accent-d:#D93169;--grad:linear-gradient(135deg,#FF7AA8,#FF4F87);--on-accent:#fff;--accent2:#FFC530;
  --hero:linear-gradient(170deg,#4FC3FF 0%,#7FD8FF 55%,#BDEEFF 100%);--hero-text:#123056;--chip:rgba(255,255,255,.75);--chip-text:#123056;
  --r:26px;--r-sm:18px;--shadow:0 6px 0 rgba(29,53,87,.07),0 12px 28px rgba(29,53,87,.08);--btn-sh:0 5px 0 var(--accent-d);
  --ring:#FF4F87;--ring-track:rgba(255,255,255,.7);--done:#22C55E;--track:#FFE4A8;
}
body[data-tier="tween"]{
  --font:'Nunito',system-ui,sans-serif;--font-head:'Fredoka',system-ui,sans-serif;--fs:16px;
  --bg:#F3F0FF;--card:#FFFFFF;--card2:#F1ECFF;--text:#1C1640;--muted:#6E6896;--line:rgba(108,76,255,.10);
  --accent:#6C4CFF;--accent-d:#4B2FD6;--grad:linear-gradient(135deg,#7C5CFF,#C04CFF);--on-accent:#fff;--accent2:#FFB020;
  --hero:linear-gradient(135deg,#5B3BFF 0%,#A64CFF 55%,#FF6FA3 100%);--hero-text:#fff;--chip:rgba(255,255,255,.18);--chip-text:#fff;
  --r:22px;--r-sm:14px;--shadow:0 10px 30px rgba(76,48,200,.12);--btn-sh:0 4px 0 var(--accent-d);
  --ring:#FFD34D;--ring-track:rgba(255,255,255,.25);--done:#14C9A0;--track:#E6E0FF;
}
body[data-tier="teen"]{
  --font:'Inter',system-ui,sans-serif;--font-head:'Space Grotesk',system-ui,sans-serif;--fs:15px;
  --bg:#08080A;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--text:#F4F4F5;--muted:#8B8B95;--line:rgba(255,255,255,.08);
  --accent:#C8FF3D;--accent-d:#A6D82A;--grad:linear-gradient(120deg,#C8FF3D,#5CE1FF);--on-accent:#08080A;--accent2:#5CE1FF;
  --hero:radial-gradient(120% 90% at 0% 0%,rgba(200,255,61,.28),transparent 55%),radial-gradient(90% 80% at 100% 0%,rgba(92,225,255,.25),transparent 55%),#0B0B0E;--hero-text:#fff;--chip:rgba(255,255,255,.06);--chip-text:#fff;
  --r:18px;--r-sm:12px;--shadow:none;--btn-sh:none;
  --ring:#C8FF3D;--ring-track:rgba(255,255,255,.1);--done:#C8FF3D;--track:rgba(255,255,255,.08);
}
body[data-tier="parent"]{
  --font:'Plus Jakarta Sans',system-ui,sans-serif;--font-head:'Plus Jakarta Sans',system-ui,sans-serif;--fs:15px;
  --bg:#F5F4F0;--card:#FFFFFF;--card2:#F2F1EC;--text:#17212F;--muted:#6A7383;--line:#E8E6E0;
  --accent:#2E6BFF;--accent-d:#1F51CC;--grad:linear-gradient(135deg,#3B7BFF,#2E5BFF);--on-accent:#fff;--accent2:#14B87A;
  --hero:linear-gradient(140deg,#14263F 0%,#1F4A8A 60%,#2E6BFF 100%);--hero-text:#fff;--chip:rgba(255,255,255,.12);--chip-text:#fff;
  --r:20px;--r-sm:12px;--shadow:0 1px 2px rgba(23,33,47,.04),0 8px 24px rgba(23,33,47,.06);--btn-sh:none;
  --ring:#5EE0A8;--ring-track:rgba(255,255,255,.2);--done:#14B87A;--track:#ECEAE4;
}

/* =================== Demo-Leiste =================== */
.demobar{position:sticky;top:0;z-index:70;background:#0F1115;color:#E8EAF0;font:500 12.5px/1.2 Inter,system-ui,sans-serif;padding:8px 10px;display:flex;gap:6px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.demobar::-webkit-scrollbar{display:none}
.demobar .lbl{color:#7C8190;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.demobar button{background:#1D2028;border:1px solid #2C303A;color:#E8EAF0;border-radius:999px;padding:6px 10px;flex:none}
.demobar button.on{background:#fff;color:#0F1115;border-color:#fff}
.demobar .sep{width:1px;height:18px;background:#2C303A;flex:none;margin:0 2px}

/* =================== Layout =================== */
.app{max-width:440px;margin:0 auto;padding:0 16px 120px;position:relative}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.82em}
.tiny{font-size:.72em}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
body[data-tier="teen"] .card{backdrop-filter:blur(12px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.sec h2{margin:0;font-size:1.25em;font-weight:700}
body[data-tier="kid"] .sec h2{font-size:1.35em;font-weight:800}
body[data-tier="teen"] .sec h2{font-size:1.05em;font-weight:600;letter-spacing:-.01em}
.sec .more{font-size:.8em;font-weight:700;color:var(--accent)}
.note{font-size:.76em;color:var(--muted);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:var(--on-accent);border-radius:999px;padding:13px 20px;font-weight:800;box-shadow:var(--btn-sh);transition:transform .08s,box-shadow .08s;font-family:var(--font-head)}
body[data-tier="teen"] .btn{font-weight:600;letter-spacing:.01em}
body[data-tier="parent"] .btn{font-weight:700}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--text);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:.85em}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--card2);font-size:.72em;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.qr{background:color-mix(in srgb,var(--pc,#16A34A) 15%,transparent);color:var(--pc,#16A34A)}
.chip.peer{background:color-mix(in srgb,#8B5CF6 14%,transparent);color:#8B5CF6}
.chip.par{background:color-mix(in srgb,#F59E0B 16%,transparent);color:#C27C00}
body[data-tier="teen"] .chip.par{color:#FBBF24}
body[data-tier="teen"] .chip.peer{color:#C4B5FD}

/* =================== Hero =================== */
.hero{position:relative;margin:0 -16px;padding:18px 18px 22px;background:var(--hero);color:var(--hero-text);border-radius:0 0 34px 34px;overflow:hidden}
body[data-tier="teen"] .hero{border-bottom:1px solid var(--line);border-radius:0 0 28px 28px}
.hero .deco{position:absolute;inset:0;pointer-events:none}
.hero>*:not(.deco){position:relative}
.hello{font-family:var(--font-head);font-size:1.6em;font-weight:800;line-height:1.05}
body[data-tier="teen"] .hello{font-size:1.75em;font-weight:700;letter-spacing:-.03em}
body[data-tier="parent"] .hello{font-size:1.45em}
.hsub{font-size:.85em;opacity:.8;margin-top:3px;font-weight:600}
.avring{position:relative;width:66px;height:66px;flex:none}
.avring svg{position:absolute;inset:0}
.avring .av{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.9);font-weight:800;color:#1D3557}
body[data-tier="teen"] .avring .av{background:#18181C;color:var(--accent);font-family:var(--font-head);font-size:22px}
body[data-tier="parent"] .avring .av{background:rgba(255,255,255,.95)}
.avring .lv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#1D1D1D;font:800 10px/1 Inter,sans-serif;padding:3px 6px;border-radius:99px;border:2px solid #fff;white-space:nowrap}
body[data-tier="teen"] .avring .lv{background:var(--accent);border-color:#0B0B0E}
.coin{display:flex;align-items:center;gap:6px;background:var(--chip);color:var(--chip-text);border-radius:999px;padding:8px 12px;font-weight:800;backdrop-filter:blur(8px);font-family:var(--font-head)}
body[data-tier="teen"] .coin{border:1px solid var(--line)}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hs{background:var(--chip);color:var(--chip-text);border-radius:var(--r-sm);padding:10px 12px;backdrop-filter:blur(8px)}
body[data-tier="teen"] .hs{border:1px solid var(--line)}
.hs b{display:block;font-family:var(--font-head);font-size:1.3em;font-weight:800;line-height:1.1}
body[data-tier="teen"] .hs b{font-weight:600}
.hs span{font-size:.7em;font-weight:700;opacity:.8}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-text)}

/* Maskottchen-Blase */
.mascot{display:flex;align-items:flex-end;gap:8px;margin:14px 2px 0}
.mascot .m{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.mascot .b{background:#fff;border-radius:20px 20px 20px 6px;padding:10px 14px;font-weight:700;box-shadow:var(--shadow)}
@keyframes bob{50%{transform:translateY(-5px)}}

/* Familie heute */
.fam{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.fam::-webkit-scrollbar{display:none}
.fam .p{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:62px;font-size:.72em;font-weight:700}
.fam .rg{position:relative;width:54px;height:54px}
.fam .rg svg{position:absolute;inset:0}
.fam .rg .av{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card);font-weight:800}
body[data-tier="teen"] .fam .rg .av{background:#18181C;font-size:15px;color:var(--accent)}
.fam .me .av{outline:2px solid var(--accent);outline-offset:1px}

/* =================== Quests =================== */
.tod{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-weight:800;font-size:.85em;color:var(--muted);font-family:var(--font-head)}
body[data-tier="teen"] .tod{text-transform:uppercase;letter-spacing:.12em;font-size:.7em;font-weight:600}
.tod::after{content:"";flex:1;height:1px;background:var(--line)}
.quest{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);position:relative;transition:transform .15s,opacity .3s}
.quest+.quest{margin-top:10px}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
body[data-tier="kid"] .tile{width:56px;height:56px;font-size:30px;border-radius:20px}
body[data-tier="teen"] .tile{background:color-mix(in srgb,var(--c1) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c1) 45%,transparent);font-size:20px;width:44px;height:44px;border-radius:12px}
body[data-tier="parent"] .tile{width:44px;height:44px;font-size:21px;border-radius:14px;box-shadow:none}
.qt{font-weight:800;line-height:1.2;font-family:var(--font-head)}
body[data-tier="kid"] .qt{font-size:1.05em}
body[data-tier="teen"] .qt,body[data-tier="parent"] .qt{font-weight:600}
.qs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.76em;color:var(--muted);margin-top:4px}
.xp{font:800 .72em/1 var(--font-head);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 7px;border-radius:99px;flex:none}
.qbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;border:3px solid var(--track);color:transparent;font-weight:900;font-size:18px;transition:all .2s}
body[data-tier="kid"] .qbtn{width:48px;height:48px;font-size:22px}
body[data-tier="teen"] .qbtn{border-width:2px;border-radius:12px;width:38px;height:38px}
.qbtn.scan{border:none;background:var(--pc,#16A34A);color:#fff;font-size:11px;font-weight:800;flex-direction:column;gap:0;line-height:1}
.qbtn.scan svg{width:18px;height:18px}
.qbtn.scan span{font:800 9px/1 Inter,sans-serif;margin-top:1px}
.quest.done{opacity:.62}
.quest.done .qt{text-decoration:line-through;text-decoration-thickness:2px}
.quest.done .qbtn{background:var(--done);border-color:var(--done);color:#fff}
body[data-tier="teen"] .quest.done .qbtn{color:#08080A}
.quest.pending .qbtn{border-style:dashed;border-color:#8B5CF6;color:#8B5CF6;font-size:16px}
.quest.pulse{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.03)}}

/* Streak */
.streak .days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.streak .d{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7em;font-weight:800;color:var(--muted)}
.streak .d i{width:100%;aspect-ratio:1;max-width:40px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-style:normal;font-size:16px}
body[data-tier="teen"] .streak .d i{border-radius:10px}
.streak .d.on i{background:linear-gradient(140deg,#FFB020,#FF5A36);box-shadow:0 3px 0 #D9461F}
body[data-tier="teen"] .streak .d.on i{background:var(--accent);box-shadow:none;color:#08080A}
.streak .d.today i{outline:3px solid var(--accent);outline-offset:2px}
.bigflame{font-size:40px;line-height:1;filter:drop-shadow(0 4px 6px rgba(255,90,54,.35))}

/* =================== Missionen =================== */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-top:16px}
.search input{border:none;outline:none;background:none;flex:1;min-width:0}
.bubbles{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.bubbles::-webkit-scrollbar{display:none}
.bub{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;width:66px;font-size:.7em;font-weight:800;text-align:center;line-height:1.1}
.bub .o{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000)}
body[data-tier="teen"] .bub .o{background:color-mix(in srgb,var(--c) 12%,#111);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 50%,transparent)}
.bub.on .o{outline:3px solid var(--accent);outline-offset:3px}
.featured{display:block;width:100%;text-align:left;border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--pc),var(--pc2));box-shadow:var(--shadow);margin-top:18px}
.featured .fe{position:absolute;right:-10px;bottom:-18px;font-size:120px;line-height:1;opacity:.95;transform:rotate(-8deg);filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
.featured .rib{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.22);padding:5px 10px;border-radius:99px;font:800 10.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.featured h3{font-size:1.5em;margin:12px 0 4px;max-width:65%;line-height:1.1}
.featured p{margin:0 0 14px;max-width:62%;font-size:.85em;opacity:.92}
.featured .go{display:inline-flex;background:#fff;color:#111;border-radius:99px;padding:9px 14px;font-weight:800;font-size:.85em}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.carousel::-webkit-scrollbar{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mtile{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:var(--r);padding:14px;min-height:168px;color:#fff;overflow:hidden;background:linear-gradient(155deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 6px 0 color-mix(in srgb,var(--c) 75%,#000),0 12px 22px rgba(0,0,0,.08);scroll-snap-align:start}
body[data-tier="tween"] .mtile{box-shadow:0 10px 24px color-mix(in srgb,var(--c) 35%,transparent)}
body[data-tier="teen"] .mtile{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 35%,transparent),transparent 60%),#141418;border:1px solid var(--line);box-shadow:none;color:var(--text)}
.carousel .mtile{flex:none;width:200px}
.mtile .me{font-size:44px;line-height:1;margin-bottom:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
body[data-tier="kid"] .mtile .me{font-size:52px}
.mtile .mt{font-family:var(--font-head);font-weight:800;font-size:1.02em;line-height:1.15;margin-top:12px}
body[data-tier="teen"] .mtile .mt{font-weight:600}
.mtile .mm{font-size:.72em;font-weight:700;opacity:.85;margin-top:4px}
.mtile .rib{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);color:#111;border-radius:99px;padding:3px 8px;font:800 10px/1.2 Inter,sans-serif}
body[data-tier="teen"] .mtile .rib{background:var(--accent);color:#08080A}
.mtile.locked{filter:grayscale(.85);opacity:.6}
.mtile.locked .rib{background:#111;color:#fff}
.mprog{height:7px;background:rgba(255,255,255,.35);border-radius:9px;overflow:hidden;margin-top:10px}
.mprog i{display:block;height:100%;background:#fff;border-radius:9px}
body[data-tier="teen"] .mprog{background:rgba(255,255,255,.1)}
body[data-tier="teen"] .mprog i{background:var(--accent)}

/* Karte */
.map{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);aspect-ratio:16/10;background:#E3F2E1}
body[data-tier="teen"] .map{background:#101013}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.pin .pi{width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--pc);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid #fff}
.pin .pi span{transform:rotate(45deg);font-size:19px}
.pin .pl{margin-top:4px;background:rgba(255,255,255,.95);color:#111;font:700 10px/1.2 Inter,sans-serif;padding:2px 6px;border-radius:6px;white-space:nowrap}
.pin .due{position:absolute;top:-6px;right:-6px;background:#FF3B30;color:#fff;border-radius:99px;font:800 10px/1 Inter;padding:3px 5px;border:2px solid #fff;z-index:2}
.me-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#2E6BFF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(46,107,255,.25);transform:translate(-50%,-50%)}

/* =================== Crew / Checks =================== */
.check-req{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,#8B5CF6 12%,var(--card)),var(--card));border:1px solid color-mix(in srgb,#8B5CF6 25%,transparent);box-shadow:var(--shadow)}
.check-req+.check-req{margin-top:10px}
.check-req .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card);flex:none;font-weight:800;box-shadow:0 0 0 3px #8B5CF6}
.coop{border-radius:var(--r);padding:18px;color:#fff;background:linear-gradient(135deg,#14C9A0,#2E9BFF);box-shadow:var(--shadow);position:relative;overflow:hidden}
body[data-tier="kid"] .coop{background:linear-gradient(135deg,#34D399,#38BDF8)}
body[data-tier="teen"] .coop{background:radial-gradient(100% 120% at 0% 0%,rgba(92,225,255,.25),transparent 60%),#141418;border:1px solid var(--line)}
.coop .avs{display:flex}
.coop .avs span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-size:24px;border:3px solid rgba(255,255,255,.6);font-weight:800}
.coop .avs span+span{margin-left:-12px}
.coop .bar{height:10px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:12px;overflow:hidden}
.coop .bar i{display:block;height:100%;background:#fff}
.feed .fi{display:flex;gap:12px;align-items:center;padding:12px 0}
.feed .fi+.fi{border-top:1px solid var(--line)}
.feed .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--card2);flex:none;font-weight:800}
.hi5{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0}
.rank .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8em;background:var(--card2)}
.rank.me{color:var(--accent);font-weight:800}

/* =================== Shop =================== */
.wallet{border-radius:var(--r);padding:18px;background:linear-gradient(135deg,#FFB020,#FF7A1A);color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;margin-top:16px}
body[data-tier="tween"] .wallet{background:linear-gradient(135deg,#FFB020,#FF5FA2)}
body[data-tier="teen"] .wallet{background:#141418;border:1px solid var(--line);color:var(--text)}
.wallet .big{font-family:var(--font-head);font-size:2.2em;font-weight:800;line-height:1}
.rw{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);border:1px solid var(--line);min-height:180px}
.rw .re{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--card2);margin-bottom:10px}
.rw .rt{font-family:var(--font-head);font-weight:800;line-height:1.15;flex:1}
body[data-tier="teen"] .rw .rt,body[data-tier="parent"] .rw .rt{font-weight:600}
.rw .price{margin-top:10px;width:100%}

/* =================== Profil =================== */
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:.72em;font-weight:700;line-height:1.15}
.medal .md{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:linear-gradient(140deg,#FFD866,#FFA51F);box-shadow:0 4px 0 #D98A0A,inset 0 0 0 4px rgba(255,255,255,.4)}
body[data-tier="teen"] .medal .md{background:#18181C;box-shadow:inset 0 0 0 1px var(--accent);font-size:22px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed var(--pc);color:var(--pc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:800 9.5px/1.15 Inter,sans-serif;padding:8px;background:color-mix(in srgb,var(--pc) 7%,transparent)}
.stamp .se{font-size:26px;margin-bottom:2px}
.stamp.empty{border-color:var(--line);color:var(--muted);background:none;filter:grayscale(1);opacity:.55}
.cmp{display:grid;grid-template-columns:24px 1fr 44px;gap:10px;align-items:center}
.cmp+.cmp{margin-top:12px}
.cmp .lab{font-size:.8em;font-weight:700;margin-bottom:4px}
.cmp .bar{height:12px;background:var(--track);border-radius:9px;overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff))}
.cmp b{text-align:right;font-family:var(--font-head)}
.tagwrap{display:flex;flex-wrap:wrap;gap:8px}
.tg{padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.85em;box-shadow:var(--shadow)}
.tg.on{background:var(--grad);color:var(--on-accent);border-color:transparent}

/* =================== Nav =================== */
.nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 24px);max-width:416px;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 6px;background:var(--card);border-radius:28px;border:1px solid var(--line);box-shadow:0 12px 34px rgba(0,0,0,.14)}
body[data-tier="teen"] .nav{background:rgba(20,20,24,.85);backdrop-filter:blur(16px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:800;padding:4px 0}
body[data-tier="kid"] .nav button{font-size:12px}
.nav button .ic{font-size:24px;line-height:1;height:24px;display:grid;place-items:center}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;margin:-4px 0 0 18px;background:#FF3B30;color:#fff;border-radius:99px;font:800 9.5px/1 Inter;padding:3px 5px}
.nav .scanbtn{margin-top:-30px}
.nav .scanbtn .sc{width:62px;height:62px;border-radius:50%;background:var(--grad);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent),0 0 0 6px var(--bg)}
.nav .scanbtn .sc svg{width:28px;height:28px}

/* =================== Sheets / Overlays =================== */
.scrim{position:fixed;inset:0;background:rgba(8,10,20,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s;backdrop-filter:blur(2px)}
.sheet{background:var(--bg);color:var(--text);width:100%;max-width:440px;max-height:90vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
body[data-tier="teen"] .sheet{background:#0E0E11;border:1px solid var(--line)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
body[data-tier="teen"] .sheet .grab{background:rgba(255,255,255,.2)}
.sheet h1{font-size:1.45em;margin:4px 0 6px;line-height:1.1}
.mhead{margin:-10px -16px 16px;padding:26px 18px 22px;color:#fff;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));border-radius:30px 30px 26px 26px;position:relative;overflow:hidden}
body[data-tier="teen"] .mhead{background:radial-gradient(110% 100% at 100% 0%,color-mix(in srgb,var(--c) 40%,transparent),transparent 60%),#141418;color:var(--text)}
.mhead .me{position:absolute;right:10px;bottom:-14px;font-size:96px;line-height:1;transform:rotate(-6deg)}
.mhead h1{font-size:1.6em;max-width:70%}
.mhead .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:72%}
.mhead .meta span{background:rgba(255,255,255,.22);padding:4px 9px;border-radius:99px;font-size:.72em;font-weight:800}
body[data-tier="teen"] .mhead .meta span{background:rgba(255,255,255,.08)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* Pfad */
.path{position:relative;padding-left:4px}
.path::before{content:"";position:absolute;left:25px;top:24px;bottom:24px;width:4px;border-radius:4px;background:var(--track)}
.node{display:flex;gap:14px;align-items:center;padding:8px 0;position:relative}
.node .nd{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;background:var(--card);border:3px solid var(--track);font-family:var(--font-head);z-index:1}
.node.done .nd{background:var(--done);border-color:var(--done);color:#fff}
body[data-tier="teen"] .node.done .nd{color:#08080A}
.node.cur .nd{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent);animation:pulse 1.6s infinite}
.node.qr .nd{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--card));font-size:20px}
.node.done.qr .nd{background:var(--pc);color:#fff}
.node .nt{font-weight:700;line-height:1.25}
.node.done .nt{color:var(--muted);text-decoration:line-through}
.node .nq{display:block;font-size:.75em;font-weight:800;color:var(--pc);margin-top:2px;text-decoration:none}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 8%,transparent)}}

/* Formulare */
.f{display:block;font-size:.78em;font-weight:800;color:var(--muted);margin:16px 2px 7px;font-family:var(--font-head)}
.in{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);outline:none;font-weight:600}
.in:focus{border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:10px 6px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.82em;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button .se{font-size:20px}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--text)}
.seg.days button{min-width:0;padding:10px 0;border-radius:12px}
.seg.days button.on{background:var(--grad);color:var(--on-accent);border-color:transparent}
.hint{font-size:.8em;color:var(--muted);background:var(--card2);border-radius:14px;padding:11px 13px;margin-top:12px;line-height:1.45}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.sw{width:48px;height:28px;border-radius:99px;background:var(--track);position:relative;flex:none;margin-top:2px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}

/* Scanner */
.scanner{position:fixed;inset:0;z-index:90;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;font-family:Inter,system-ui,sans-serif;animation:fade .2s}
.scanner .cam{position:absolute;inset:0;overflow:hidden;background:radial-gradient(80% 60% at 50% 35%,#4B4136,#1A1714 70%)}
.scanner .cam .wall{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:220px;filter:blur(7px) saturate(.6);opacity:.45}
.scanner .cam .floor{position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6))}
.scanner .top{position:relative;width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;padding:16px}
.scanner .top button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;backdrop-filter:blur(8px)}
.finder{position:relative;width:240px;height:240px;margin-top:4vh}
.finder .poster{position:absolute;inset:34px;background:#fff;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg) skewX(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:.92}
.finder .poster svg{width:100%;height:auto}
.finder .poster b{color:#111;font-size:9px;margin-top:4px;letter-spacing:.05em}
.finder .cn{position:absolute;width:44px;height:44px;border:5px solid #fff;border-radius:6px}
.finder .cn.a{top:0;left:0;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
.finder .cn.b{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 14px 0 0}
.finder .cn.c{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 14px}
.finder .cn.d{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 14px 0}
.finder .laser{position:absolute;left:14px;right:14px;height:3px;background:#C8FF3D;box-shadow:0 0 14px 3px rgba(200,255,61,.7);border-radius:3px;animation:laser 2s ease-in-out infinite}
@keyframes laser{0%,100%{top:16px}50%{top:220px}}
.scanner .sh{position:relative;margin-top:22px;font-weight:600;font-size:14px;opacity:.9;text-align:center;padding:0 30px}
.scanner .sim{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(18,18,22,.92);backdrop-filter:blur(16px);border-radius:26px 26px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto}
.scanner .sim .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9A9AA5;font-weight:700;margin-bottom:10px}
.simbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:16px;background:rgba(255,255,255,.06);color:#fff}
.simbtn+.simbtn{margin-top:8px}
.simbtn .pe{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pc);flex:none}
.simbtn .due{background:#C8FF3D;color:#111;font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px}
.scanner.ok{background:radial-gradient(90% 60% at 50% 30%,var(--pc),#0B0B0E 75%);justify-content:center;text-align:center;padding:24px}
.bigstamp{width:180px;height:180px;border-radius:50%;border:6px dashed #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;background:rgba(255,255,255,.12)}
.bigstamp .se{font-size:64px;line-height:1}
.bigstamp small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.9;margin-top:6px;max-width:140px}
@keyframes stamp{from{transform:scale(2.4) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.okcard{background:rgba(255,255,255,.12);border-radius:18px;padding:14px;margin-top:12px;width:100%;max-width:360px;text-align:left;backdrop-filter:blur(10px)}

/* Toast / Konfetti */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#14161C;color:#fff;padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;z-index:100;animation:tin .3s cubic-bezier(.2,1.4,.4,1);max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:var(--font-head)}
body[data-tier="kid"] .toast{background:var(--grad);font-size:17px;padding:13px 22px}
body[data-tier="tween"] .toast{background:var(--grad)}
body[data-tier="teen"] .toast{background:var(--accent);color:#08080A}
@keyframes tin{from{transform:translate(-50%,20px) scale(.9);opacity:0}}
.confetti{position:fixed;top:-14px;width:10px;height:14px;z-index:99;pointer-events:none;border-radius:3px;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg)}}

/* Onboarding */
.onb{padding-top:20px}
.onb .stepbar{display:flex;gap:6px;margin-bottom:22px}
.onb .stepbar i{flex:1;height:6px;border-radius:9px;background:var(--track)}
.onb .stepbar i.on{background:var(--grad)}
.onb h1{font-size:1.9em;line-height:1.08;margin:0 0 8px}
body[data-tier="teen"] .onb h1{letter-spacing:-.03em}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.bigchoice button{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:22px 10px;font-weight:800;box-shadow:var(--shadow);font-family:var(--font-head);font-size:1.05em}
.bigchoice button .e{font-size:46px;display:block;margin-bottom:8px}
.bigchoice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avgrid button{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--line);font-size:30px;box-shadow:var(--shadow);font-weight:800}
.avgrid button.on{border-color:var(--accent);transform:scale(1.06)}
.agebig{font-family:var(--font-head);font-size:84px;font-weight:800;text-align:center;line-height:1;margin-top:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0 4px;height:34px}
.onbfoot{position:sticky;bottom:0;display:flex;gap:10px;padding:16px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}

/* Partner-Dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r-sm);padding:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.6em;font-weight:800;line-height:1.1}
.kpi span{font-size:.75em;color:var(--muted);font-weight:600}
.kpi em{font-style:normal;font-size:.75em;color:var(--accent2);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66em;color:var(--muted);font-weight:700;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--pc2),var(--pc))}
.poster{background:#fff;color:#111;border-radius:16px;padding:18px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.12);border:1px solid #eee;max-width:260px;margin:0 auto}
.poster .pt{font:800 11px/1 Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--pc)}
.poster h3{margin:8px 0 10px;font-size:1.25em}
.poster .qr{width:150px;height:150px}
.qr{background:#fff;border-radius:8px}
</style>

function ringSvg(size, stroke, pct, color, track){
  const r = (size-stroke)/2, C = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.max(0,Math.min(1,pct)))}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/></svg>`;
}

// ---------- Logik ----------
function todayItems(m){
  const items = (m.agenda||[]).filter(i => i.days.includes(WD)).map(i => ({...i, check:i.check||'self'}));
  (m.missions||[]).forEach(a => {
    const mi = mById(a.id); if (!mi || a.step >= mi.steps.length) return;
    const s = mi.steps[a.step], qr = stepQR(s);
    items.push({id:'m:'+a.id, title:stepT(s), sub:`${mi.title} · ${a.step+1}/${mi.steps.length}`, type:'mission', cat:mi.cat, time:'', check:qr?'qr':'self', partner:qr, mission:mi.id});
  });
  return items.sort((a,b) => (a.time||'').localeCompare(b.time||''));
}
const status = (m, id) => (m.log[TODAY_KEY]||{})[id];
function progressOf(m){ const it = todayItems(m); return {done:it.filter(i => status(m,i.id)==='done').length, total:it.length}; }
function award(m, type, cat, sign=1){
  const T = TYPES[type];
  m.xp = Math.max(0, m.xp + sign*T.xp); m.coins = Math.max(0, (m.coins||0) + sign*T.coins);
  m.offline.week = Math.max(0, m.offline.week + sign*T.min);
  const c = cat || ({termin:'sport',haushalt:'kochen',habit:'wissen'}[type]);
  m.catXP[c] = Math.max(0, (m.catXP[c]||0) + sign*T.xp);
  if (sign > 0 && !m.activeDays.includes(TODAY_KEY)) m.activeDays.push(TODAY_KEY);
}
function advanceMission(m, mid){
  const a = (m.missions||[]).find(x => x.id === mid); if (!a) return;
  a.step++; const mi = mById(mid);
  if (a.step >= mi.steps.length){ m.badges.unshift(`${CATS[mi.cat].e}|${mi.title}`); m.xp += 100; m.coins += 30; setTimeout(() => openModal({type:'missionDone', id:mid}), 500); }
}
function toggleItem(m, item){
  if (item.check === 'qr' && status(m,item.id) !== 'done'){ openScan(item.partner); return; }
  m.log[TODAY_KEY] = m.log[TODAY_KEY] || {};
  const st = m.log[TODAY_KEY][item.id], tier = tierOf(m);
  if (st === 'done'){
    delete m.log[TODAY_KEY][item.id];
    if (item.type === 'mission'){ const a = m.missions.find(x => x.id === item.mission); if (a) a.step = Math.max(0, a.step-1); }
    award(m, item.type, item.cat, -1); toast('Rückgängig');
  } else if (st === 'pending'){
    delete m.log[TODAY_KEY][item.id]; toast('Check-Anfrage zurückgezogen');
  } else if (item.check === 'parent' || item.check === 'peer'){
    m.log[TODAY_KEY][item.id] = 'pending';
    toast(item.check === 'peer' ? (m.role==='parent' ? 'Die Kinder dürfen das jetzt bestätigen 😄' : 'Check-Anfrage an Familie & Freunde 🤝') : COPY[tier].pending);
  } else {
    m.log[TODAY_KEY][item.id] = 'done';
    if (item.type === 'mission') advanceMission(m, item.mission);
    award(m, item.type, item.cat, 1); celebrate(tier); UI.pulse = item.id;
  }
  save(); render();
}
function checkRequests(v){
  const out = [];
  family().forEach(o => {
    if (o.id === v.id) return;
    Object.entries(o.log[TODAY_KEY]||{}).forEach(([id, st]) => {
      if (st !== 'pending') return;
      const it = (o.agenda||[]).find(a => a.id === id); if (!it) return;
      if (it.check === 'peer' || (it.check === 'parent' && v.role === 'parent')) out.push({kind:'task', o, it});
    });
  });
  if (v.role === 'kid') (v.peerReq||[]).forEach(r => out.push({kind:'friend', r}));
  if (v.role === 'parent') S.redemptions.filter(r => r.status === 'pending').forEach(r => out.push({kind:'reward', r, o:byId(r.memberId), rw:S.rewards.find(x => x.id === r.rewardId)}));

}
function weekActive(m){ return weekDates().map(d => m.activeDays.includes(dkey(d))); }
function dueQR(m){ // Partner, bei denen gerade ein QR-Schritt fällig ist
  const out = {};
  (m.missions||[]).forEach(a => { const mi = mById(a.id); if (mi && a.step < mi.steps.length){ const q = stepQR(mi.steps[a.step]); if (q) out[q] = mi; } });
  return out;
}

function renderScanner(){

  const m = me();
  if (sc.result){

    if (r.peer) return `<div class="scanner ok" style="--pc:#8B5CF6"><div class="bigstamp"><span class="se">🤝</span><small>Peer-Check</small></div>

    return `<div class="scanner ok" style="--pc:${P.c}"><div class="bigstamp"><span class="se">${P.e}</span><small>${esc(P.n)}<br>${TODAY.toLocaleDateString('de-DE')}</small></div>
      <h1 style="font-family:var(--font-head);margin:22px 0 4px">Eingecheckt!</h1><div style="opacity:.85">${esc(P.station)}</div>
      ${r.mission ? `<div class="okcard">🚀 <b>Missionsschritt erledigt</b><div class="small" style="opacity:.85;margin-top:2px">${esc(r.mission)} · „${esc(r.step)}“ · +${TYPES.mission.xp} XP</div></div>` : `<div class="okcard">📍 <b>Stempel gesammelt</b><div class="small" style="opacity:.85;margin-top:2px">Tipp: Starte hier eine Partner-Mission für Bonus-XP.</div></div>`}
      <div class="okcard">🎟️ <b>Partner-Vorteil</b><div class="small" style="opacity:.85;margin-top:2px">${esc(P.perk)}</div></div>
      <button class="btn block" style="max-width:360px;margin-top:18px" data-action="scanClose">Weiter</button></div>`;
  }
  const due = m.role === 'kid' || m.role === 'parent' ? dueQR(m) : {};
  const order = Object.keys(PARTNERS).sort((a,b) => (due[b]?1:0)-(due[a]?1:0) || (a===sc.target?-1:0));
  const T = sc.target ? PARTNERS[sc.target] : PARTNERS[order[0]];
  const peers = m.role === 'kid' ? (m.peerReq||[]) : [];
  return `<div class="scanner"><div class="cam"><div class="wall">${T.e}</div><div class="floor"></div></div>
    <div class="top"><button data-action="scanClose" aria-label="Schließen">✕</button><b>QR-Code scannen</b><span style="width:40px"></span></div>
    <div class="finder"><div class="poster">${qrSvg(sc.target||order[0])}<b>LIFEQUEST · ${esc(T.station.toUpperCase())}</b></div><i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i><div class="laser"></div></div>
    <div class="sh">Halte die Kamera auf den LifeQuest-Code beim Partner – oder auf den Code einer Freundin / eines Freundes für einen Peer-Check.</div>
    <div class="sim"><div class="lbl">Demo · Scan simulieren</div>
      ${order.map(k => { const P = PARTNERS[k]; return `<button class="simbtn" style="--pc:${P.c}" data-action="doScan" data-id="${k}"><span class="pe">${P.e}</span><span class="grow"><b>${esc(P.n)}</b><span class="small" style="display:block;opacity:.7">${esc(P.station)} · ${esc(P.dist)}</span></span>${due[k]?`<span class="due">fällig: ${esc(due[k].title)}</span>`:''}</button>`; }).join('')}
      ${peers.map(r => `<button class="simbtn" style="--pc:#8B5CF6" data-action="doPeerScan" data-id="${r.id}"><span class="pe">🤝</span><span class="grow"><b>Code von ${esc(r.from)}</b><span class="small" style="display:block;opacity:.7">Peer-Check: „${esc(r.title)}“</span></span></button>`).join('')}
    </div></div>`;
}
function doScan(pid){
  const m = me();
  m.stamps = m.stamps || []; m.stamps.push({p:pid, d:TODAY_KEY});
  const due = dueQR(m)[pid];
  let res = {pid};
  if (due){
    const a = m.missions.find(x => x.id === due.id);
    res.mission = due.title; res.step = stepT(due.steps[a.step]);
    m.log[TODAY_KEY] = m.log[TODAY_KEY] || {}; m.log[TODAY_KEY]['m:'+due.id] = 'done';
    award(m, 'mission', due.cat, 1); advanceMission(m, due.id);
    // Schritt für heute als erledigt markieren (neuer Schritt erscheint morgen) – hier: Log-Eintrag bleibt für nächsten Schritt frei
    delete m.log[TODAY_KEY]['m:'+due.id];
  } else { m.xp += 10; if (!m.activeDays.includes(TODAY_KEY)) m.activeDays.push(TODAY_KEY); }
  UI.scan.result = res; save(); render(); celebrate(tierOf(m), true);
}

  } else if (o.step === 2){
    const t = onbTier(o);
    c = `<h1>Wie dürfen wir dich ansprechen?</h1>
      <div class="seg" style="margin-top:14px">${[['w','Mädchen'],['m','Junge'],['x','Divers'],['n','Keine Angabe']].map(([k,l]) => `<button class="${o.gender===k?'on':''}" data-action="onbGender" data-id="${k}">${l}</button>`).join('')}</div>
      <div class="hint">Freiwillig. Nur für Ansprache und Avatar – alle Missionen sind für alle da.</div>
      <label class="f">Dein Avatar</label>
      <div class="avgrid">${(t==='teen' ? [(o.name?.[0]||'A').toUpperCase(),'★','◆','●','▲','✦','♪','⚡'] : KID_AVATARS).map(a => `<button class="${o.avatar===a?'on':''}" data-action="onbAvatar" data-id="${esc(a)}">${esc(a)}</button>`).join('')}</div>`;
  } else if (o.step === 3){
    c = `<h1>Was hast du zuhause?</h1><p class="muted">Wie beim Trainingsplan: nur Missionen, die du wirklich machen kannst.</p>
      <div class="tagwrap">${Object.entries(EQUIP).map(([k,e]) => `<button class="tg ${o.equip.includes(k)?'on':''}" data-action="onbEquip" data-id="${k}">${e.e} ${e.n}</button>`).join('')}</div>`;
  } else if (o.step === 4){
    c = `<h1>Was interessiert dich?</h1><p class="muted">So viele du willst.</p>
      <div class="bubbles" style="flex-wrap:wrap;justify-content:space-between;overflow:visible">${Object.entries(CATS).map(([k,cc]) => `<button class="bub ${o.interests.includes(k)?'on':''}" style="--c:${cc.c}" data-action="onbInterest" data-id="${k}"><span class="o">${cc.e}</span>${cc.n}</button>`).join('')}</div>`;
  } else {
    const t = onbTier(o), fake = {age:o.age, equip:o.equip, missions:[], interests:o.interests};
    const rec = MISSIONS.filter(x => o.age >= x.age[0] && o.age <= x.age[1] && x.needs.every(n => o.equip.includes(n))).sort((a,b) => (o.interests.includes(b.cat)?1:0)-(o.interests.includes(a.cat)?1:0));
    c = `<h1>${t==='kid' ? 'Super, '+esc(o.name||'du')+'! 🎉' : 'Alles klar, '+esc(o.name||'du')+'.'}</h1><p class="muted">${rec.length} Missionen passen zu dir. Deine Top 4:</p>
      <div class="grid2">${rec.slice(0,4).map(x => mTile(fake,x,t,false)).join('')}</div><div class="hint">Als Nächstes verbindet ein Elternteil dein Profil mit der Familie.</div>`;
  }
  const isLast = (o.role === 'parent' && o.step === 1) || o.step === 5;
  return `<div class="app onb">${bar}${c}<div class="onbfoot">${o.step>0?`<button class="btn soft" data-action="onbBack">Zurück</button>`:''}<button class="btn grow" ${o.step===0 && !o.role ? 'disabled' : ''} data-action="${isLast?'onbFinish':'onbNext'}">${isLast?'Los geht’s':'Weiter'}</button></div></div>`;
}
function finishOnb(){
  const o = UI.onb, id = 'u'+uid(), all = [0,1,2,3,4,5,6];
  const base = {xp:0, coins:10, streakWeeks:0, jokers:1, offline:{week:0}, activeDays:[], catXP:{}, stamps:[], log:{}};
  if (o.role === 'parent'){
    S.members.splice(S.members.findIndex(x => x.role==='partner'), 0, {id, role:'parent', name:o.name||'Elternteil', age:40, avatar:'🧑', ...base, agenda:[{id:uid(), title:'Handyfreies Abendessen', type:'habit', days:all, time:'18:30', by:'self', check:'peer'}]});
  } else {
    const t = onbTier(o);
    const agenda = {kid:[['Zähne putzen','habit','07:10'],['Schulranzen packen','habit','19:00'],['5 Minuten lesen','habit','19:15']],
      tween:[['Wasser trinken 💧','habit','07:00'],['Zimmer 5 Min aufräumen','haushalt','18:00'],['Handy um 20 Uhr weglegen','habit','20:00']],
      teen:[['10 Min Bewegung','habit','07:00'],['Wochenplan checken','habit','19:00'],['Handy ab 22 Uhr aus dem Zimmer','habit','22:00']]}[t]
      .map(([title,type,time]) => ({id:uid(), title, type, days:all, time, by:'kid', check:'self'}));
    S.members.splice(S.members.findIndex(x => x.role==='partner'), 0, {id, role:'kid', name:o.name||'Neu', age:o.age, gender:o.gender, avatar:o.avatar||(t==='teen'?(o.name?.[0]||'A').toUpperCase():'🐸'),
      equip:o.equip, interests:o.interests.length?o.interests:['sport'], ...base, missions:[], badges:['🌟|Erster Schritt'], friends:[], peerReq:[],
      coop:{mission:'Noch keine – lade Freund:innen ein', partner:'–', pav:'?', progress:0, total:1}, agenda});
  }
  S.activeId = id; UI.onb = null; save(); render(); toast('Profil angelegt');
}

// ---------- Render ----------
function render(){
  const y = window.scrollY, m = me();
  document.body.dataset.tier = UI.onb ? onbTier(UI.onb) : tierOf(m);
  const main = UI.onb ? renderOnb() : m.role === 'partner' ? renderPartner(m) : m.role === 'parent' ? renderParent(m) : renderKid(m);
  $('#root').innerHTML = renderDemoBar() + main + renderModal() + renderScanner();
  window.scrollTo(0, UI.top ? 0 : y); UI.top = false; UI.pulse = null;
}
function resetForm(extra){ UI.form = {title:'', time:'', type:'habit', freq:'all', check:'self', days:[1,2,3,4,5], e:'🍕', kind:'Erlebnis', cost:'100', ...extra}; }

// ---------- Events ----------
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  if (a.dataset.action === 'scrim' && e.target.closest('[data-stop]')) return;
  const id = a.dataset.id, m = me();
  switch (a.dataset.action){
    case 'persona': S.activeId = id; UI.onb = null; UI.modal = null; UI.scan = null; UI.top = true; save(); render(); break;
    case 'tab': UI.tab[m.id] = +id; UI.top = true; render(); break;
    case 'profile': if (m.role === 'kid'){ UI.tab[m.id] = 5; UI.top = true; render(); } break;
    case 'toggle': { const it = todayItems(m).find(i => i.id === id); if (it) toggleItem(m, it); break; }
    case 'cat': UI.cat = id || null; render(); break;
    case 'mission': UI.modal = {type:'mission', id}; render(); break;
    case 'partner': openModal({type:'partner', id}); break;
    case 'startMission': {
      m.missions = m.missions || []; if (!m.missions.find(x => x.id === id)) m.missions.push({id, step:0});
      const mi = mById(id);
      if (a.dataset.coop && m.friends?.length) m.coop = {mission:mi.title, partner:m.friends[0].name, pav:m.friends[0].avatar, progress:0, total:mi.steps.length};
      UI.modal = null; save(); render(); celebrate(tierOf(m), true); toast(a.dataset.coop ? 'Einladung gesendet – Mission gestartet' : 'Mission gestartet – Schritt 1 steht in „Heute“'); break; }
    case 'stopMission': m.missions = m.missions.filter(x => x.id !== id); save(); closeModal(); break;
    case 'equip': m.equip = m.equip.includes(id) ? m.equip.filter(x => x !== id) : [...m.equip, id]; save(); render(); break;
    case 'interest': m.interests = m.interests.includes(id) ? m.interests.filter(x => x !== id) : [...m.interests, id]; save(); render(); break;
    case 'redeem': { const r = S.rewards.find(x => x.id === id); if (!r || m.coins < r.cost) break;
      m.coins -= r.cost; S.redemptions.push({id:uid(), memberId:m.id, rewardId:id, status:'pending'}); save(); render(); toast(tierOf(m)==='kid' ? 'Wunsch geschickt! 💌' : 'Anfrage an Eltern gesendet'); break; }
    case 'cheer': toast(`👏 an ${id} geschickt`); break;
    case 'invite': openModal({type:'invite'}); break;
    case 'addOwn': resetForm({check:'self', time:'17:00'}); openModal({type:'addOwn'}); break;
    case 'agenda': resetForm({type:'haushalt', time:'18:00'}); openModal({type:'agenda', id}); break;
    case 'addReward': resetForm(); openModal({type:'addReward'}); break;
    case 'settings': openModal({type:'settings'}); break;
    case 'about': openModal({type:'about'}); break;
    case 'close': case 'scrim': closeModal(); break;
    case 'fset': UI.form[a.dataset.k] = id; render(); break;
    case 'fday': { const d = +id; UI.form.days = UI.form.days.includes(d) ? UI.form.days.filter(x => x !== d) : [...UI.form.days, d]; render(); break; }
    case 'reset': if (confirm('Demo auf Ausgangszustand zurücksetzen?')){ S = seed(); UI.onb = null; UI.modal = null; UI.scan = null; UI.tab = {}; UI.top = true; save(); render(); } break;
    // Scanner
    case 'scan': openScan(null); break;
    case 'scanAt': UI.modal = null; openScan(id); break;
    case 'doScan': doScan(id); break;
    case 'doPeerScan': { const r = (m.peerReq||[]).find(x => x.id === id); m.peerReq = m.peerReq.filter(x => x.id !== id); m.xp += 5;
      UI.scan.result = {peer:true, text:`${r.from}: „${r.title}“`}; save(); render(); celebrate(tierOf(m), true); break; }
    case 'scanClose': UI.scan = null; render(); break;
    // Checks
    case 'okFriend': m.peerReq = m.peerReq.filter(x => x.id !== id); m.xp += 5; save(); render(); toast('Bestätigt – +5 XP fürs Checken'); break;
    case 'noFriend': m.peerReq = m.peerReq.filter(x => x.id !== id); save(); render(); toast('Danke für die Ehrlichkeit 👍'); break;
    case 'okTask': { const [oid, iid] = id.split('|'); const o = byId(oid), it = o.agenda.find(x => x.id === iid);
      o.log[TODAY_KEY][iid] = 'done'; award(o, it.type, null, 1); if (m.role === 'kid') m.xp += 5; save(); render(); toast(`Bestätigt – ${o.name} bekommt +${TYPES[it.type].xp} XP`); break; }
    case 'noTask': { const [oid, iid] = id.split('|'); const o = byId(oid); delete o.log[TODAY_KEY][iid]; save(); render(); toast(`Zurück an ${o.name}`); break; }
    case 'okRw': { const r = S.redemptions.find(x => x.id === id); r.status = 'approved'; save(); render(); toast('Freigegeben 🎉'); break; }
    case 'noRw': { const r = S.redemptions.find(x => x.id === id), rw = S.rewards.find(x => x.id === r.rewardId), k = byId(r.memberId);
      k.coins += rw ? rw.cost : 0; S.redemptions = S.redemptions.filter(x => x.id !== id); save(); render(); toast('Coins zurückgegeben – ein andermal'); break; }
    case 'delAgenda': { const [kid, aid] = id.split('|'); const k = byId(kid); k.agenda = k.agenda.filter(x => x.id !== aid); save(); render(); toast('Entfernt'); break; }
    case 'delReward': S.rewards = S.rewards.filter(x => x.id !== id); save(); render(); break;
    case 'setting': { const s = S.settings;
      if (id === 'streakMode') s.streakMode = s.streakMode === 'week' ? 'day' : 'week';
      else if (id === 'compare') s.compare = s.compare === 'age' ? 'friends' : 'age';
      else s[id] = !s[id];
      save(); render(); break; }
    // Onboarding
    case 'startOnb': UI.onb = {step:0, role:null, name:'', age:10, gender:'n', avatar:null, equip:[], interests:[]}; UI.modal = null; UI.scan = null; UI.top = true; render(); break;
    case 'onbRole': UI.onb.role = id; render(); break;
    case 'onbNext': UI.onb.step++; UI.top = true; render(); break;
    case 'onbBack': UI.onb.step--; UI.top = true; render(); break;
    case 'onbGender': UI.onb.gender = id; render(); break;
    case 'onbAvatar': UI.onb.avatar = id; render(); break;
    case 'onbEquip': { const o = UI.onb; o.equip = o.equip.includes(id) ? o.equip.filter(x => x !== id) : [...o.equip, id]; render(); break; }
    case 'onbInterest': { const o = UI.onb; o.interests = o.interests.includes(id) ? o.interests.filter(x => x !== id) : [...o.interests, id]; render(); break; }
    case 'onbFinish': UI.top = true; finishOnb(); break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'search'){ UI.search = e.target.value; const pos = e.target.selectionStart; render(); const inp = document.querySelector('[data-input="search"]'); inp.focus(); inp.setSelectionRange(pos, pos); }
  else if (k === 'onbName') UI.onb.name = e.target.value;
  else if (k === 'ftitle') UI.form.title = e.target.value;
  else if (k === 'ftime') UI.form.time = e.target.value;
  else if (k === 'onbAge'){
    UI.onb.age = +e.target.value; const t = onbTier(UI.onb);
    document.body.dataset.tier = t; $('#ageVal').textContent = UI.onb.age; $('#tierName').textContent = `Jahre · ${TIER_NAME[t]}`; $('#onbPrev').innerHTML = onbPreview(UI.onb);
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const m = me(), F = UI.form, title = (F.title||'').trim();
  if (!title){ toast('Bitte einen Titel eingeben'); return; }
  if (f === 'plan'){
    const k = byId(UI.modal.id);
    if (!F.days.length){ toast('Bitte mindestens einen Tag wählen'); return; }
    k.agenda.push({id:uid(), title, type:F.type, days:[...F.days], time:F.time||'18:00', by:'parent', check:F.check});
    k.agenda.sort((a,b) => a.time.localeCompare(b.time)); resetForm({type:'haushalt', time:'18:00'}); save(); render(); toast(`Für ${k.name} hinzugefügt`);
  } else if (f === 'reward'){
    S.rewards.push({id:uid(), title, e:F.e, cost:+F.cost, kind:F.kind}); S.rewards.sort((a,b) => a.cost - b.cost);
    UI.modal = null; save(); render(); toast('Belohnung hinzugefügt');
  } else if (f === 'own'){
    const days = F.freq === 'all' ? [0,1,2,3,4,5,6] : F.freq === 'wd' ? [1,2,3,4,5] : [WD];
    m.agenda.push({id:uid(), title, type:F.type, days, time:F.time||'17:00', by:m.role==='parent'?'self':'kid', check:F.check});
    m.agenda.sort((a,b) => a.time.localeCompare(b.time)); UI.modal = null; save(); render(); toast(tierOf(m)==='kid' ? 'Dein Ziel ist drin! ✨' : 'Ziel hinzugefügt');
  }
});

resetForm();
render();
</script>
</body>
</html>
