<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeQuest – Demonstrator</title>
<meta name="description" content="Klickbarer Demonstrator: Alltags-Gamification für Familien – Agenda, Missionen, Streaks, Belohnungen, Freunde.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- Themes pro Altersstufe ---------- */
body{
  font-family:var(--font);font-size:var(--fs);color:var(--text);
  background:var(--bg);background-attachment:fixed;min-height:100vh;
  transition:background .4s,color .3s;-webkit-font-smoothing:antialiased;
}
body[data-tier="kid"]{
  --font:'Baloo 2',ui-rounded,system-ui,sans-serif;--fs:18px;
  --bg:linear-gradient(180deg,#BFE6FF 0%,#E9F6FF 40%,#FFF3C4 100%);
  --surface:#FFFFFF;--surface2:#FFF6DB;--text:#2A2350;--muted:#6F6A92;
  --accent:#FF5C8A;--accent-dark:#D63E6C;--accent2:#FFC93C;--on-accent:#fff;
  --radius:24px;--border:transparent;--shadow:0 6px 0 rgba(42,35,80,.08),0 10px 24px rgba(42,35,80,.08);
  --btn-shadow:0 5px 0 var(--accent-dark);--check:#2DBE6C;--track:#FFE9A8;
}
body[data-tier="tween"]{
  --font:'Nunito',system-ui,sans-serif;--fs:16px;
  --bg:linear-gradient(180deg,#EEE9FF 0%,#F6F4FF 50%,#EAFBF8 100%);
  --surface:#FFFFFF;--surface2:#F3F0FF;--text:#1E1B3A;--muted:#6B6890;
  --accent:#6C4CFF;--accent-dark:#4E31D9;--accent2:#22C3B5;--on-accent:#fff;
  --radius:16px;--border:rgba(108,76,255,.10);--shadow:0 4px 16px rgba(60,40,160,.10);
  --btn-shadow:0 3px 0 var(--accent-dark);--check:#22C3B5;--track:#E5DFFF;
}
body[data-tier="teen"]{
  --font:'Inter',system-ui,sans-serif;--fs:15px;
  --bg:#0D0E12;
  --surface:#16181F;--surface2:#1E2129;--text:#ECEEF3;--muted:#8A90A0;
  --accent:#C8FF3D;--accent-dark:#A6D82A;--accent2:#5CE1FF;--on-accent:#0D0E12;
  --radius:10px;--border:#262A33;--shadow:none;
  --btn-shadow:none;--check:#C8FF3D;--track:#262A33;
}
body[data-tier="parent"]{
  --font:'Inter',system-ui,sans-serif;--fs:15px;
  --bg:#F4F5F7;
  --surface:#FFFFFF;--surface2:#F0F3F8;--text:#1B2230;--muted:#667085;
  --accent:#2F6FEB;--accent-dark:#1F55C2;--accent2:#12B76A;--on-accent:#fff;
  --radius:12px;--border:#E4E7EC;--shadow:0 1px 2px rgba(16,24,40,.05);
  --btn-shadow:none;--check:#12B76A;--track:#E4E7EC;
}

/* ---------- Demo-Leiste (neutral, unabhängig vom Theme) ---------- */
.demobar{position:sticky;top:0;z-index:60;background:#111318;color:#E8EAF0;
  font:500 13px/1.2 Inter,system-ui,sans-serif;padding:8px 10px;display:flex;gap:6px;
  align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.demobar::-webkit-scrollbar{display:none}
.demobar .lbl{color:#8A90A0;margin-right:2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.demobar button{background:#22252D;border:1px solid #2E323C;color:#E8EAF0;border-radius:999px;padding:6px 10px;font:inherit;flex:none}
.demobar button.on{background:#E8EAF0;color:#111318;border-color:#E8EAF0}
.demobar .sep{width:1px;height:20px;background:#2E323C;flex:none;margin:0 2px}

/* ---------- Layout ---------- */
.app{max-width:440px;margin:0 auto;padding:12px 16px 110px;min-height:calc(100vh - 44px)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:40;
  display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
body[data-tier="kid"] .nav{border-radius:24px 24px 0 0}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--muted);font-size:11px;font-weight:700;padding:4px 6px;border-radius:12px;min-width:58px}
.nav button .ic{font-size:22px;line-height:1}
body[data-tier="kid"] .nav button{font-size:13px}
body[data-tier="kid"] .nav button .ic{font-size:28px}
.nav button.on{color:var(--accent)}
body[data-tier="teen"] .nav button .ic{font-size:13px;font-weight:700;letter-spacing:.05em;height:22px;display:flex;align-items:center}
body[data-tier="teen"] .nav button.on{color:var(--accent)}

h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:1.6em;font-weight:800}
h2{font-size:1.15em;font-weight:800;margin:22px 2px 10px}
body[data-tier="teen"] h2{font-size:.78em;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
body[data-tier="parent"] h2{font-size:1em;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.82em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:.78em;font-weight:700;color:var(--muted)}
.tag{font:700 10px/1 Inter,system-ui;letter-spacing:.08em;padding:4px 6px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.btn{background:var(--accent);color:var(--on-accent);border:none;border-radius:999px;padding:11px 18px;font-weight:800;box-shadow:var(--btn-shadow);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:none}
body[data-tier="teen"] .btn,body[data-tier="parent"] .btn{border-radius:8px;font-weight:600}
.btn.ghost{background:var(--surface2);color:var(--text);box-shadow:none}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:.85em}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Header ---------- */
.hdr{padding:6px 2px 4px}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--surface2);flex:none;font-weight:800}
body[data-tier="kid"] .avatar{width:58px;height:58px;font-size:36px;background:#fff;box-shadow:0 4px 0 rgba(42,35,80,.08)}
body[data-tier="teen"] .avatar{border-radius:10px;font-size:18px;background:var(--accent);color:var(--on-accent)}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--surface);border-radius:var(--radius);padding:10px 12px;border:1px solid var(--border);box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.25em;font-weight:800}
.stat span{font-size:.75em;color:var(--muted);font-weight:700}
body[data-tier="teen"] .stat b{font-variant-numeric:tabular-nums}
.xpbar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:6px}
body[data-tier="kid"] .xpbar{height:14px}
body[data-tier="teen"] .xpbar{height:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .5s}
body[data-tier="teen"] .xpbar i{background:var(--accent)}

/* ---------- Streak ---------- */
.streak .flame{font-size:34px;line-height:1}
body[data-tier="teen"] .streak .flame{font-size:24px;filter:saturate(.6)}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{flex:1;text-align:center;font-size:.7em;font-weight:700;color:var(--muted)}
.dot i{display:block;height:28px;border-radius:10px;background:var(--track);margin-bottom:4px;display:grid;place-items:center;font-style:normal;font-size:14px}
body[data-tier="teen"] .dot i{height:6px;border-radius:2px}
.dot.on i{background:var(--accent2);color:#fff}
body[data-tier="teen"] .dot.on i{background:var(--accent)}
.dot.today i{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Agenda-Items ---------- */
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:opacity .3s,transform .2s}
.item+.item{margin-top:8px}
.item .ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--surface2)}
body[data-tier="kid"] .item .ico{width:50px;height:50px;font-size:28px;border-radius:18px}
body[data-tier="teen"] .item .ico{width:auto;height:auto;background:none}
.item .t{font-weight:800;line-height:1.2}
body[data-tier="teen"] .item .t,body[data-tier="parent"] .item .t{font-weight:600}
.item .s{font-size:.78em;color:var(--muted);margin-top:2px}
.check{width:36px;height:36px;border-radius:50%;border:3px solid var(--track);background:none;flex:none;display:grid;place-items:center;font-size:18px;color:transparent;font-weight:900}
body[data-tier="kid"] .check{width:44px;height:44px;font-size:22px}
body[data-tier="teen"] .check{border-radius:6px;width:26px;height:26px;border-width:2px;font-size:14px}
.item.done{opacity:.6}
.item.done .t{text-decoration:line-through}
.item.done .check{background:var(--check);border-color:var(--check);color:#fff}
body[data-tier="teen"] .item.done .check{color:#0D0E12}
.item.pending .check{border-color:var(--accent2);color:var(--accent2);border-style:dashed}
.badge-type{font-size:.7em;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}

/* ---------- Missionen ---------- */
.search{width:100%;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);outline:none}
body[data-tier="kid"] .search{border:3px solid #fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.85em;box-shadow:var(--shadow)}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mcard{display:flex;gap:12px;padding:12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);text-align:left;width:100%;border-left:6px solid var(--c)}
.mcard+.mcard{margin-top:8px}
body[data-tier="teen"] .mcard{border-left:1px solid var(--border)}
.mcard .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
body[data-tier="kid"] .mcard .mi{width:58px;height:58px;font-size:32px;border-radius:18px}
body[data-tier="teen"] .mcard .mi{background:none;width:auto}
.mcard .t{font-weight:800}
body[data-tier="teen"] .mcard .t{font-weight:600}
.mcard .d{font-size:.8em;color:var(--muted);margin-top:2px}
.mcard.locked{opacity:.6}
.prog{height:6px;background:var(--track);border-radius:9px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--c,var(--accent))}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.catbtn{border:none;border-radius:var(--radius);padding:14px;text-align:left;background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:var(--shadow);font-weight:800}
.catbtn .e{font-size:28px;display:block}
body[data-tier="teen"] .catbtn{background:var(--surface);border:1px solid var(--border);font-weight:600}
body[data-tier="teen"] .catbtn .e{font-size:11px;letter-spacing:.1em;color:var(--c);margin-bottom:6px}

/* ---------- Vergleich ---------- */
.cmp{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:.85em}
.cmp+.cmp{margin-top:8px}
.cmp .bar{height:12px;background:var(--track);border-radius:9px;position:relative;overflow:hidden}
.cmp .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:9px}
.cmp b{text-align:right}

/* ---------- Modal / Toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);color:var(--text);width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
body[data-tier="teen"] .sheet{border:1px solid var(--border);border-radius:14px 14px 0 0}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--track);margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1B1E26;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;animation:fade .2s;max-width:90vw;text-align:center}
body[data-tier="kid"] .toast{background:var(--accent);font-size:17px;padding:12px 20px}
body[data-tier="teen"] .toast{background:var(--accent);color:#0D0E12;border-radius:8px}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}

/* ---------- Formulare ---------- */
label.f{display:block;font-size:.8em;font-weight:700;color:var(--muted);margin:12px 0 5px}
input.in,select.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);outline:none}
body[data-tier="kid"] input.in{border:2px solid var(--track)}
input.in:focus,select.in:focus{border-color:var(--accent)}
.daypick{display:flex;gap:5px}
.daypick button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--border);background:var(--surface2);font-weight:700;font-size:.8em}
.daypick button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toggle{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.toggle:last-child{border-bottom:none}
.sw{width:44px;height:26px;border-radius:99px;background:var(--track);position:relative;flex:none;border:none;margin-top:2px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}

/* ---------- Onboarding ---------- */
.onb{padding-top:10px}
.onb .step{font-size:.8em;font-weight:700;color:var(--muted)}
.onb h1{margin:6px 0 4px}
.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.choice button{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:16px 10px;font-weight:800;box-shadow:var(--shadow)}
.choice button .e{font-size:34px;display:block;margin-bottom:4px}
.choice button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.choice.c3{grid-template-columns:repeat(3,1fr)}
.choice.c4{grid-template-columns:repeat(4,1fr)}
.choice.c4 button{padding:10px 4px;font-size:26px}
.agebig{font-size:64px;font-weight:800;text-align:center;line-height:1;margin-top:18px}
input[type=range]{width:100%;accent-color:var(--accent);margin:14px 0 4px;height:30px}
.tierinfo{text-align:center;font-weight:700;color:var(--muted)}
.hint{font-size:.8em;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 12px;margin-top:12px}
.onbfoot{display:flex;gap:10px;margin-top:22px}

.empty{text-align:center;padding:20px;color:var(--muted)}
.feed .fi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.feed .fi:last-child{border-bottom:none}
.qr{width:120px;height:120px;background:#fff;padding:8px;border-radius:10px}
.kpi{font-size:1.5em;font-weight:800}
.note{font-size:.75em;color:var(--muted);font-style:italic}
.mascot{font-size:48px;line-height:1}
.bubble{background:#fff;border-radius:20px;padding:10px 14px;font-weight:700;position:relative;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
</style>
</head>
<body data-tier="tween">
<div id="root"></div>

<script>
/* =====================================================================
   LifeQuest – Demonstrator (rein clientseitig, Beispieldaten)
   ===================================================================== */

// ---------- Stammdaten ----------
const CATS = {

const TYPES = {

  haushalt:{n:'Haushalt',    e:'🧹', t:'HH',  xp:15, coins:5, min:10},

};
const DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WEEK_ORDER = [1,2,3,4,5,6,0];

const MISSIONS = [
  {id:'wetter', cat:'wissen', title:'Wetter-Forscher:in', age:[6,10], weeks:1, needs:[], desc:'Eine Woche lang Wolken, Wind und Temperatur beobachten und ein Wettertagebuch malen.', steps:['Wolkenarten anschauen (Bild oder Buch)','3 Tage Wetter aufmalen','Wetterregel ausprobieren: „Abendrot …“','Familie das Wetter von morgen vorhersagen']},
  {id:'museum', cat:'wissen', title:'Museums-Expedition', age:[9,17], weeks:2, needs:[], desc:'Ein Museum in deiner Nähe besuchen und beim Abendessen 3 überraschende Fakten präsentieren.', steps:['Museum aussuchen & mit Familie planen','Besuch: 3 Fakten notieren','Beim Abendessen präsentieren']},
  {id:'erklaer', cat:'wissen', title:'Erklär’s in 2 Minuten', age:[12,17], weeks:4, needs:[], desc:'Jede Woche ein Thema aus seriösen Quellen recherchieren und es der Familie in 2 Minuten erklären.', steps:['Thema 1 wählen & 2 seriöse Quellen finden','Thema 1 erklären','Thema 2','Thema 3','Thema 4 – Familie stellt Fragen']},

// ---------- Logik ----------
function todayItems(m){
  const items = m.agenda.filter(i => i.days.includes(WD)).map(i => ({...i}));
  (m.missions||[]).forEach(a => {
    const mi = missionById(a.id); if (!mi || a.step >= mi.steps.length) return;
    items.push({id:'m:'+a.id, title:mi.steps[a.step], sub:`${mi.title} · Schritt ${a.step+1}/${mi.steps.length}`, type:'mission', cat:mi.cat, time:'', by:'mission'});
  });
  return items.sort((a,b) => (a.time||'99').localeCompare(b.time||'99'));
}
const status = (m, id) => (m.log[TODAY_KEY]||{})[id];
function award(m, type, cat, sign=1){
  const T = TYPES[type];
  m.xp = Math.max(0, m.xp + sign*T.xp); m.coins = Math.max(0, m.coins + sign*T.coins);
  m.offline.week = Math.max(0, m.offline.week + sign*T.min);
  const c = cat || ({termin:'sport',haushalt:'kochen',habit:'wissen'}[type]);
  m.catXP[c] = Math.max(0, (m.catXP[c]||0) + sign*T.xp);
  if (sign > 0 && !m.activeDays.includes(TODAY_KEY)) m.activeDays.push(TODAY_KEY);
}
function toggleItem(m, item){
  m.log[TODAY_KEY] = m.log[TODAY_KEY] || {};
  const st = m.log[TODAY_KEY][item.id];
  const tier = tierOf(m);
  if (st === 'done'){
    delete m.log[TODAY_KEY][item.id];
    if (item.type === 'mission'){ const a = m.missions.find(x => 'm:'+x.id === item.id); if (a) a.step = Math.max(0, a.step-1); }
    award(m, item.type, item.cat, -1);
    toast(tier === 'teen' ? 'Rückgängig' : 'Rückgängig gemacht');
  } else if (st === 'pending'){
    delete m.log[TODAY_KEY][item.id];
    toast('Anfrage zurückgezogen');
  } else if (item.confirm){
    m.log[TODAY_KEY][item.id] = 'pending';
    toast(COPY[tier].pending);
  } else {
    m.log[TODAY_KEY][item.id] = 'done';
    if (item.type === 'mission'){
      const a = m.missions.find(x => 'm:'+x.id === item.id);
      if (a){ a.step++; const mi = missionById(a.id); if (a.step >= mi.steps.length) finishMission(m, mi); }
    }
    award(m, item.type, item.cat, 1);
    celebrate(tier);
  }
  save(); render();
}
function finishMission(m, mi){
  m.badges.unshift(tierOf(m) === 'teen' ? mi.title : `${CATS[mi.cat].e} ${mi.title}`);
  m.xp += 100; m.coins += 30;
  setTimeout(() => openModal({type:'missionDone', mi}), 400);
}
function weekActive(m){ return weekDates().map(d => m.activeDays.includes(dkey(d))); }

// ---------- Effekte ----------
let toastTimer;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1900);
}
function celebrate(tier){
  const msgs = COPY[tier].done; toast(msgs[Math.floor(Math.random()*msgs.length)]);
  if (tier === 'teen') return;
  const cols = tier === 'kid' ? ['#FF5C8A','#FFC93C','#2DBE6C','#4A7DFF','#7C5CFF','#FF9F1C'] : ['#6C4CFF','#22C3B5','#FFC93C','#FF5C8A'];
  const n = tier === 'kid' ? 40 : 18;
  for (let i=0;i<n;i++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random()*100+'vw'; c.style.background = cols[i%cols.length];
    c.style.animationDelay = Math.random()*.3+'s'; c.style.animationDuration = (1+Math.random()*.8)+'s';
    document.body.appendChild(c); setTimeout(() => c.remove(), 2300);
  }
}

// ---------- QR (dekorativ) ----------
function qrSvg(seedStr){
  let h = 0; for (const c of seedStr) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const n = 21, cells = [];
  const finder = (x,y) => { for (let i=0;i<7;i++) for (let j=0;j<7;j++){ const edge = i===0||i===6||j===0||j===6, core = i>=2&&i<=4&&j>=2&&j<=4; if (edge||core) cells.push([x+i,y+j]); } };
  finder(0,0); finder(14,0); finder(0,14);
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    if ((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12)) continue;
    h = (h*1103515245 + 12345) >>> 0; if ((h>>16)&1) cells.push([x,y]);
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${cells.map(([x,y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`).join('')}</svg>`;
}

// ---------- Haupt-Render ----------
function render(){
  const scrollY = window.scrollY;
  const m = me();
  document.body.dataset.tier = UI.onb ? onbTier(UI.onb) : tierOf(m);
  const main = UI.onb ? renderOnb() : (m.role === 'parent' ? renderParent(m) : renderKid(m));
  $('#root').innerHTML = renderDemoBar() + main + renderModal();
  if (UI.keepScroll) window.scrollTo(0, scrollY); else window.scrollTo(0, 0);
  UI.keepScroll = true;
}

// ---------- Events ----------
document.addEventListener('click', e => {
  const sheet = e.target.closest('[data-stop]');
  const a = e.target.closest('[data-action]');
  if (!a) return;
  if (a.dataset.action === 'scrim' && sheet) return;
  const id = a.dataset.id, m = me();
  const fresh = () => { UI.keepScroll = false; };
  switch (a.dataset.action){
    case 'persona': S.activeId = id; UI.onb = null; UI.modal = null; save(); fresh(); render(); break;
    case 'tab': UI.tab[m.id] = +id; fresh(); render(); break;
    case 'ptab': UI.tab[m.id] = +id; fresh(); render(); break;
    case 'toggle': { const it = todayItems(m).find(i => i.id === id); if (it) toggleItem(m, it); break; }
    case 'cat': UI.missionCat = id || null; render(); break;
    case 'mission': openModal({type:'mission', id}); break;
    case 'startMission': {
      m.missions = m.missions || []; if (!m.missions.find(x => x.id===id)) m.missions.push({id, step:0});
      const mi = missionById(id);
      if (a.dataset.coop) m.coop = {mission:mi.title, partner:(m.friends[0]||{}).name||'Freund:in', progress:0, total:mi.steps.length};
      save(); UI.modal = null; render(); celebrate(tierOf(m)); toast(a.dataset.coop ? 'Einladung gesendet – Mission gestartet' : 'Mission gestartet – Schritt 1 steht in „Heute“'); break; }
    case 'stopMission': m.missions = m.missions.filter(x => x.id !== id); save(); closeModal(); break;
    case 'equip': m.equip = m.equip.includes(id) ? m.equip.filter(x => x!==id) : [...m.equip, id]; save(); render(); break;
    case 'interest': m.interests = m.interests.includes(id) ? m.interests.filter(x => x!==id) : [...m.interests, id]; save(); render(); break;
    case 'redeem': {
      const r = S.rewards.find(x => x.id===id); if (!r || m.coins < r.cost) break;
      m.coins -= r.cost; S.redemptions.push({id:uid(), memberId:m.id, rewardId:id, status:'pending'}); save(); render();
      toast(tierOf(m)==='kid' ? 'Wunsch geschickt! 💌' : 'Anfrage an Eltern gesendet'); break; }
    case 'cheer': toast(`👏 an ${id} geschickt`); break;
    case 'invite': openModal({type:'invite'}); break;
    case 'addOwn': openModal({type:'addOwn'}); break;
    case 'about': openModal({type:'about'}); break;
    case 'close': closeModal(); break;
    case 'scrim': closeModal(); break;
    case 'reset': if (confirm('Demo auf Ausgangszustand zurücksetzen?')){ S = seed(); UI.onb = null; UI.modal = null; UI.tab = {}; save(); fresh(); render(); } break;
    case 'startOnb': UI.onb = {step:0, role:null, name:'', age:10, gender:'n', avatar:null, equip:[], interests:[]}; UI.modal = null; fresh(); render(); break;
    case 'onbRole': UI.onb.role = id; render(); break;
    case 'onbNext': UI.onb.step++; fresh(); render(); break;
    case 'onbBack': UI.onb.step--; fresh(); render(); break;
    case 'onbGender': UI.onb.gender = id; render(); break;
    case 'onbAvatar': UI.onb.avatar = id; render(); break;
    case 'onbEquip': { const o = UI.onb; o.equip = o.equip.includes(id) ? o.equip.filter(x => x!==id) : [...o.equip, id]; render(); break; }
    case 'onbInterest': { const o = UI.onb; o.interests = o.interests.includes(id) ? o.interests.filter(x => x!==id) : [...o.interests, id]; render(); break; }
    case 'onbFinish': fresh(); finishOnb(); break;
    // Eltern
    case 'planKid': UI.planKid = id; render(); break;
    case 'ptype': UI.planForm.type = id; render(); break;
    case 'pday': { const d = +id, f = UI.planForm; f.days = f.days.includes(d) ? f.days.filter(x => x!==d) : [...f.days, d]; render(); break; }
    case 'delAgenda': { const k = S.members.find(x => x.id===UI.planKid); k.agenda = k.agenda.filter(x => x.id!==id); save(); render(); toast('Entfernt'); break; }
    case 'approveTask': { const [kid, itemId] = id.split('|'); const k = S.members.find(x => x.id===kid); const it = k.agenda.find(x => x.id===itemId);
      k.log[TODAY_KEY][itemId] = 'done'; award(k, it.type, null, 1); save(); render(); toast(`Bestätigt – ${k.name} bekommt +${TYPES[it.type].xp} XP`); break; }
    case 'approveRw': { const r = S.redemptions.find(x => x.id===id); r.status = 'approved'; save(); render(); toast('Freigegeben 🎉'); break; }
    case 'declineRw': { const r = S.redemptions.find(x => x.id===id); const rw = S.rewards.find(x => x.id===r.rewardId); const k = S.members.find(x => x.id===r.memberId);
      k.coins += rw ? rw.cost : 0; S.redemptions = S.redemptions.filter(x => x.id!==id); save(); render(); toast('Coins zurückgegeben – ein andermal'); break; }
    case 'delReward': S.rewards = S.rewards.filter(x => x.id!==id); save(); render(); break;
    case 'setting': {
      const s = S.settings;
      if (id==='streakMode') s.streakMode = s.streakMode==='week' ? 'day' : 'week';
      else if (id==='compare') s.compare = s.compare==='age' ? 'friends' : 'age';
      else s[id] = !s[id];
      save(); render(); break; }
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'search'){ UI.search = e.target.value; const pos = e.target.selectionStart; render(); const inp = document.querySelector('[data-input="search"]'); inp.focus(); inp.setSelectionRange(pos,pos); }
  else if (k === 'onbName'){ UI.onb.name = e.target.value; }
  else if (k === 'onbAge'){
    UI.onb.age = +e.target.value; const t = onbTier(UI.onb);
    document.body.dataset.tier = t;
    $('#ageVal').textContent = UI.onb.age; $('#tierName').textContent = `Jahre · ${TIER_NAME[t]}`;
    $('#onbPrev').innerHTML = onbPreview(UI.onb);
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  const fd = new FormData(e.target), m = me();
  if (f === 'plan'){
    const k = S.members.find(x => x.id===UI.planKid);
    if (!UI.planForm.days.length){ toast('Bitte mindestens einen Tag wählen'); return; }
    k.agenda.push({id:uid(), title:fd.get('title').trim(), type:UI.planForm.type, days:[...UI.planForm.days], time:fd.get('time')||'', by:'parent', confirm:fd.get('confirm')==='1'});
    k.agenda.sort((a,b) => (a.time||'').localeCompare(b.time||''));
    save(); render(); toast(`Für ${k.name} hinzugefügt`);
  } else if (f === 'reward'){
    S.rewards.push({id:uid(), title:fd.get('title').trim(), e:fd.get('e')||'🎁', cost:Math.max(10, +fd.get('cost')||100), kind:fd.get('kind')});
    S.rewards.sort((a,b) => a.cost-b.cost); save(); render(); toast('Belohnung hinzugefügt');
  } else if (f === 'own'){
    const freq = fd.get('freq');
    const days = freq==='all' ? [0,1,2,3,4,5,6] : freq==='wd' ? [1,2,3,4,5] : [WD];
    m.agenda.push({id:uid(), title:fd.get('title').trim(), type:fd.get('type'), days, time:fd.get('time')||'', by:'kid'});
    m.agenda.sort((a,b) => (a.time||'').localeCompare(b.time||''));
    UI.modal = null; save(); render(); toast(tierOf(m)==='kid' ? 'Dein Ziel ist drin! ✨' : 'Ziel hinzugefügt');
  }
});

render();
</script>
</body>
</html>
